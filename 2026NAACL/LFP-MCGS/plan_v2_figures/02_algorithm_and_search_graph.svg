<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1320" viewBox="0 0 2048 1320" role="img" aria-labelledby="title desc">
  <title id="title">LFP-MCGS 三层语义与无泄漏搜索过程</title><desc id="desc">区分 recursive predicate graph、grounded productive trace、fixed-program LFP chain 与 exact transposition graph</desc><defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10243a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#586b80"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e5ebf2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2048" height="1320" fill="#ffffff"/><rect width="2048" height="1320" fill="url(#grid)" opacity="0.35"/><text x="64" y="72" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="800" fill="#10243a" text-anchor="start">PLANNED ALGORITHM · 图可有环，固定程序闭包是单链，只有充分状态等价才合并</text><text x="64" y="112" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="500" fill="#586b80" text-anchor="start">未查询 test outcome 永远不可见；没有 dev-only simulator 或合法 merge，就不能称为 MCGS。</text><line x1="64" y1="138" x2="1984" y2="138" stroke="#cad5e1" stroke-width="2" stroke-linecap="round"/><rect x="64" y="170" width="560" height="440" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/><rect x="64" y="170" width="560" height="82" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="86" y="206" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#2563eb" text-anchor="start">① Predicate recursion + ground trace</text><text x="86" y="235" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="600" fill="#586b80" text-anchor="start">SCC 在 predicate graph；贡献由 ground instance 验证</text><rect x="664" y="170" width="590" height="440" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)"/><rect x="664" y="170" width="590" height="82" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text x="686" y="206" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#15803d" text-anchor="start">② Fixed-program LFP chain</text><text x="686" y="235" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="600" fill="#586b80" text-anchor="start">固定 F/R：K₀ → K₁ → … → K* 是唯一单链</text><rect x="1294" y="170" width="690" height="440" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/><rect x="1294" y="170" width="690" height="82" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1316" y="206" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="800" fill="#7c3aed" text-anchor="start">③ Exact transposition graph</text><text x="1316" y="235" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="600" fill="#586b80" text-anchor="start">只有 decision-sufficient state 等价才共享 value</text><rect x="88" y="274" width="260" height="38" rx="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="218" y="300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">predicate SCC: A ↔ B</text><text x="492" y="299" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#586b80" text-anchor="middle">grounded derivation</text><circle cx="120" cy="390" r="40" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="120" y="397" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800" fill="#10243a" text-anchor="middle">a(c₀)</text><circle cx="285" cy="390" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="285" y="397" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800" fill="#10243a" text-anchor="middle">b(c₁)</text><circle cx="470" cy="390" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="470" y="397" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="800" fill="#10243a" text-anchor="middle">a(c₂)</text><circle cx="470" cy="515" r="38" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="470" y="522" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#10243a" text-anchor="middle">q</text><line x1="160" y1="390" x2="242" y2="390" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><line x1="327" y1="390" x2="426" y2="390" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/><line x1="470" y1="433" x2="470" y2="474" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="377" y="366" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="750" fill="#c62828" text-anchor="middle">B→A feedback instance</text><text x="286" y="467" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">external seed a(c₀) · feedback 产出新 a(c₂)</text><text x="344" y="578" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#c62828" text-anchor="middle">delete b(c₁)→a(c₂)  ⇒  a(c₂), q disappear</text><line x1="780" y1="410" x2="823" y2="410" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><line x1="927" y1="410" x2="970" y2="410" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><line x1="1074" y1="410" x2="1118" y2="410" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><circle cx="728" cy="410" r="52" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="728" y="417" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#10243a" text-anchor="middle">K₀={a(c₀)}</text><circle cx="875" cy="410" r="52" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="875" y="417" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#10243a" text-anchor="middle">K₁=+b(c₁)</text><circle cx="1022" cy="410" r="52" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1022" y="417" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#10243a" text-anchor="middle">K₂=+a(c₂)</text><circle cx="1170" cy="410" r="52" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="1170" y="417" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="800" fill="#10243a" text-anchor="middle">K*=+q</text><text x="959" y="520" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d" text-anchor="middle">每轮只传播 ΔK；无 seed 时整条链不启动</text><text x="959" y="565" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="650" fill="#586b80" text-anchor="middle">跨不同 commit actions 是 partial-program state poset，不是这条 LFP 链</text><circle cx="1635" cy="295" r="42" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1635" y="302" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#10243a" text-anchor="middle">s₀</text><circle cx="1460" cy="405" r="48" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="1460" y="412" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#10243a" text-anchor="middle">读 W₁</text><circle cx="1810" cy="405" r="48" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="1810" y="412" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="800" fill="#10243a" text-anchor="middle">读 W₂</text><circle cx="1635" cy="540" r="62" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1635" y="547" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="800" fill="#10243a" text-anchor="middle">same full key</text><line x1="1601" y1="323" x2="1496" y2="378" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/><line x1="1669" y1="323" x2="1774" y2="378" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/><line x1="1496" y1="439" x2="1592" y2="508" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/><line x1="1774" y1="439" x2="1678" y2="508" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/><text x="1635" y="585" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="650" fill="#7c3aed" text-anchor="middle">F/R/K + ledger + samples + action mask + cost + belief b_t / pφ version + reward</text><rect x="64" y="660" width="1920" height="566" rx="24" fill="#f8fafc" stroke="#cad5e1" stroke-width="2.5"/><text x="92" y="708" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="800" fill="#10243a" text-anchor="start">一次无 test leakage 的真实决策</text><rect x="92" y="748" width="300" height="235" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/><rect x="92" y="748" width="300" height="58" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="242" y="786" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#2563eb" text-anchor="middle">Real root s(t)</text><text x="114" y="842" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">materialized outcomes</text><text x="114" y="879" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">F/R/K + ledger</text><text x="114" y="916" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">coverage + cost</text><rect x="438" y="748" width="340" height="235" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/><rect x="438" y="748" width="340" height="58" rx="17" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="608" y="786" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#7c3aed" text-anchor="middle">Abstract rollout ≥2</text><text x="460" y="842" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">dev-only sketch p_phi</text><text x="460" y="879" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">embedding + state only</text><text x="460" y="916" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">no atom/rule/commit</text><rect x="824" y="748" width="300" height="235" rx="18" fill="#ffffff" stroke="#c66a05" stroke-width="2.5" filter="url(#shadow)"/><rect x="824" y="748" width="300" height="58" rx="17" fill="#fef3c7" stroke="#c66a05" stroke-width="2.5"/><text x="974" y="786" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#c66a05" text-anchor="middle">Select root action</text><text x="846" y="842" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">选择 window/sample</text><text x="846" y="879" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">simulation backprop</text><text x="846" y="916" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">真实状态尚未改变</text><rect x="1170" y="748" width="370" height="235" rx="18" fill="#ffffff" stroke="#c62828" stroke-width="2.5" filter="url(#shadow)"/><rect x="1170" y="748" width="370" height="58" rx="17" fill="#fee2e2" stroke="#c62828" stroke-width="2.5"/><text x="1355" y="786" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#c62828" text-anchor="middle">Charged real outcome</text><text x="1192" y="842" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">此时才调用 LLM</text><text x="1192" y="879" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">或 replay reveal</text><text x="1192" y="916" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">candidate + usage log</text><rect x="1586" y="748" width="350" height="235" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)"/><rect x="1586" y="748" width="350" height="58" rx="17" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text x="1761" y="786" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="800" fill="#15803d" text-anchor="middle">Validate + advance</text><text x="1608" y="842" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">gate + deterministic ΔLFP</text><text x="1608" y="879" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">检查 exact merge key</text><text x="1608" y="916" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" fill="#10243a" text-anchor="start">新 root / safe reuse</text><line x1="400" y1="866" x2="428" y2="866" stroke="#586b80" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="786" y1="866" x2="814" y2="866" stroke="#586b80" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1132" y1="866" x2="1160" y2="866" stroke="#586b80" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1548" y1="866" x2="1576" y2="866" stroke="#586b80" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1760 995 C1760 1095 300 1110 244 994" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow-violet)"/><text x="1024" y="1086" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#7c3aed" text-anchor="middle">只有 root action 获得真实 parse；sketch rollout 不产出符号；仅 exact-equivalent successor 共享 value</text><rect x="96" y="1130" width="875" height="66" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="534" y="1172" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#15803d" text-anchor="middle">保留 MCGS：sketch p_phi + rollout&gt;1 + exact merge 均有独立收益</text><rect x="1077" y="1130" width="859" height="66" rx="16" fill="#fee2e2" stroke="#c62828" stroke-width="2"/><text x="1507" y="1172" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="800" fill="#c62828" text-anchor="middle">无 simulator、非法 merge 或 TT hit≈0：改名 obligation-guided active search</text></svg>