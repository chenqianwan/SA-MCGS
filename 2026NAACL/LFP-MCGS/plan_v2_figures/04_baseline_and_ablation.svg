<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1650" viewBox="0 0 2048 1650" role="img" aria-labelledby="title desc">
  <title id="title">LFP-MCGS baseline 公平协议与原子消融</title><desc id="desc">区分共享内部底座的 scheduler controls 与 method-native external systems，并使用 matched simulator controls、deterministic budget 和六个原子开关</desc><defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10243a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#586b80"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e5ebf2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2048" height="1650" fill="#ffffff"/><rect width="2048" height="1650" fill="url(#grid)" opacity="0.35"/><text x="64" y="72" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="800" fill="#10243a" text-anchor="start">PLANNED BASELINES · 两层公平性，六个原子开关</text><text x="64" y="112" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="500" fill="#586b80" text-anchor="start">Internal controls 隔离 scheduler；external systems 分报 native answer 与 adapted certificate，不用接口差异制造胜负。</text><line x1="64" y1="138" x2="1984" y2="138" stroke="#cad5e1" stroke-width="2" stroke-linecap="round"/><rect x="64" y="165" width="1920" height="102" rx="20" fill="#0b2a46" stroke="#0b2a46" stroke-width="3" filter="url(#shadow)"/><text x="92" y="206" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="start">A · Scheduler causal controls</text><text x="92" y="243" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="650" fill="#ffffff" text-anchor="start">same G0ret / parser / validator / LFP；φ-Greedy / Beam / TreeMCTS / ours 另共享 sketch pφ + inference cap</text><line x1="1024" y1="273" x2="230" y2="300" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="64" y="302" width="332" height="142" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" filter="url(#shadow)"/><rect x="64" y="302" width="332" height="50" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="230" y="335" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f766e" text-anchor="middle">Exhaustive</text><text x="84" y="389" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">Extract-All-Local</text><text x="84" y="421" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">否定：选择性无价值</text><line x1="1024" y1="273" x2="611" y2="300" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="445" y="302" width="332" height="142" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)"/><rect x="445" y="302" width="332" height="50" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text x="611" y="335" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#15803d" text-anchor="middle">Deterministic</text><text x="465" y="389" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">Static / Greedy / φ-Greedy</text><text x="465" y="421" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">否定：one-step policy 已足够</text><line x1="1024" y1="273" x2="992" y2="300" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="826" y="302" width="332" height="142" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/><rect x="826" y="302" width="332" height="50" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="992" y="335" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#7c3aed" text-anchor="middle">Matched lookahead</text><text x="846" y="389" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">φ-Beam / TreeMCTS</text><text x="846" y="421" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">否定：MC 或 merge 无价值</text><line x1="1024" y1="273" x2="1373" y2="300" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1207" y="302" width="332" height="142" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/><rect x="1207" y="302" width="332" height="50" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="1373" y="335" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#2563eb" text-anchor="middle">Paper 1 policy</text><text x="1227" y="389" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">SA-policy + LFP</text><text x="1227" y="421" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">否定：只靠旧 backbone</text><line x1="1024" y1="273" x2="1754" y2="300" stroke="#c66a05" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1588" y="302" width="332" height="142" rx="18" fill="#ffffff" stroke="#c66a05" stroke-width="2.5" filter="url(#shadow)"/><rect x="1588" y="302" width="332" height="50" rx="16" fill="#fef3c7" stroke="#c66a05" stroke-width="2.5"/><text x="1754" y="335" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#c66a05" text-anchor="middle">Proposed</text><text x="1608" y="389" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">LFP-MCGS</text><text x="1608" y="421" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">same pφ + exact merge</text><rect x="64" y="482" width="1920" height="90" rx="18" fill="#eef2f7" stroke="#cad5e1" stroke-width="2.5"/><text x="92" y="519" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="800" fill="#10243a" text-anchor="start">B · Method-native external systems</text><text x="92" y="552" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="650" fill="#586b80" text-anchor="start">same raw input · model snapshot · actual-cost protocol；Native Answer 与 Certificate-Bearing Accuracy 分栏</text><rect x="64" y="596" width="430" height="142" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/><rect x="64" y="596" width="430" height="50" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="279" y="629" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#2563eb" text-anchor="middle">Global formalization</text><text x="86" y="684" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">Full-Formalize + LFP</text><text x="86" y="716" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">native + certificate endpoints</text><rect x="554" y="596" width="430" height="142" rx="18" fill="#ffffff" stroke="#c66a05" stroke-width="2.5" filter="url(#shadow)"/><rect x="554" y="596" width="430" height="50" rx="16" fill="#fef3c7" stroke="#c66a05" stroke-width="2.5"/><text x="769" y="629" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#c66a05" text-anchor="middle">Official SymBa</text><text x="576" y="684" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">method-native procedure</text><text x="576" y="716" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">先报原生 answer accuracy</text><rect x="1044" y="596" width="430" height="142" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/><rect x="1044" y="596" width="430" height="50" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="1259" y="629" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#7c3aed" text-anchor="middle">Authors’ adapters</text><text x="1066" y="684" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">SymBa+Cert / Tabled+Cert</text><text x="1066" y="716" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">两行；额外调用全计费</text><rect x="1534" y="596" width="450" height="142" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)"/><rect x="1534" y="596" width="450" height="50" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/><text x="1759" y="629" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#15803d" text-anchor="middle">External memory</text><text x="1556" y="684" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">Symbolic Working Memory</text><text x="1556" y="716" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">N/A 不机械判错</text><rect x="64" y="778" width="1920" height="170" rx="20" fill="#f8fafc" stroke="#cad5e1" stroke-width="2.5"/><text x="92" y="820" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="800" fill="#10243a" text-anchor="start">无内生预算、无 replay 泄漏</text><rect x="465" y="793" width="190" height="38" rx="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="560" y="819" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">Scheduler replay</text><text x="678" y="820" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="650" fill="#10243a" text-anchor="start">hidden outcome 仅在 action 后 reveal；p_phi 只看 dev</text><rect x="1322" y="793" width="150" height="38" rx="19" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="1397" y="819" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle">Live E2E</text><text x="1492" y="820" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="650" fill="#10243a" text-anchor="start">graph / retry / invalid / verifier 全计费</text><text x="92" y="875" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#7c3aed" text-anchor="start">Replay budget：deterministic B_ref = source tokens + fixed output cap。E2E：dev-frozen absolute budgets + actual-total-token Pareto。</text><text x="92" y="915" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="650" fill="#586b80" text-anchor="start">C_all 只做事后归一化；one-shot 在其真实可运行成本形成 Pareto 单点，不能机械判 Unresolved。</text><text x="64" y="1010" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="800" fill="#10243a" text-anchor="start">六个原子消融：每次只关一个机制</text><rect x="64" y="1048" width="1920" height="66" rx="13" fill="#fee2e2" stroke="#c62828" stroke-width="2"/><rect x="82" y="1062" width="70" height="38" rx="19" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/><text x="117" y="1088" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#c62828" text-anchor="middle">A1</text><text x="178" y="1091" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#c62828" text-anchor="start">- source anchor</text><text x="820" y="1091" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="start">Circular-FPR ↑</text><text x="1315" y="1091" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">cycle 产物不能伪装 base fact</text><rect x="64" y="1130" width="1920" height="66" rx="13" fill="#fef3c7" stroke="#c66a05" stroke-width="2"/><rect x="82" y="1144" width="70" height="38" rx="19" fill="#ffffff" stroke="#c66a05" stroke-width="1.5"/><text x="117" y="1170" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#c66a05" text-anchor="middle">A2</text><text x="178" y="1173" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#c66a05" text-anchor="start">- validator gate</text><text x="820" y="1173" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="start">source support / PVQA ↓</text><text x="1315" y="1173" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">formal validity 仍应为 100%</text><rect x="64" y="1212" width="1920" height="66" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="82" y="1226" width="70" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="117" y="1252" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">A3</text><text x="178" y="1255" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#2563eb" text-anchor="start">- delta trigger</text><text x="820" y="1255" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="start">Propagation Recall ↓</text><text x="1315" y="1255" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">新 ΔK 是否改变 action set</text><rect x="64" y="1294" width="1920" height="66" rx="13" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="82" y="1308" width="70" height="38" rx="19" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="117" y="1334" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e" text-anchor="middle">A4</text><text x="178" y="1337" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f766e" text-anchor="start">- obligation priority</text><text x="820" y="1337" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="start">windows-to-proof ↑</text><text x="1315" y="1337" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">deficit priority vs static relevance</text><rect x="64" y="1376" width="1920" height="66" rx="13" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><rect x="82" y="1390" width="70" height="38" rx="19" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="117" y="1416" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#15803d" text-anchor="middle">A5</text><text x="178" y="1419" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#15803d" text-anchor="start">rollout depth &gt;1 → 1</text><text x="820" y="1419" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="start">PVQA-token Pareto ↓</text><text x="1315" y="1419" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">多步 planning vs one-step selection</text><rect x="64" y="1458" width="1920" height="66" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="82" y="1472" width="70" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="117" y="1498" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">A6</text><text x="178" y="1501" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="800" fill="#7c3aed" text-anchor="start">- exact state merge</text><text x="820" y="1501" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="start">duplicate state / cost ↑</text><text x="1315" y="1501" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="650" fill="#10243a" text-anchor="start">合法 graph sharing 的价值</text><rect x="64" y="1558" width="1920" height="58" rx="14" fill="#0b2a46" stroke="#0b2a46" stroke-width="2"/><text x="1024" y="1597" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">判死线：φ-Greedy / φ-Beam / Extract-All / SymBa 持平，或 simulator/merge 不合法 → 删掉 MCGS 主张。</text></svg>