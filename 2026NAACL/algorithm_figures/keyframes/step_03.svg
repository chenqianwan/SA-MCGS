<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LFP-MCGS 动态演算 4/8</title>
  <desc id="desc">找到 conjunction 的一半，并记录完整缺失前提</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1f33" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.32"/><rect x="40" y="28" width="102" height="38" rx="19" fill="#0b1f33" stroke="#0b1f33" stroke-width="1.5"/><text x="91" y="54" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 3</text><text x="160" y="61" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#0b1f33" text-anchor="start">找到 conjunction 的一半，并记录完整缺失前提</text><text x="160" y="94" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650" fill="#526579" text-anchor="start">Wmid={r2,d2} 提交 Clear(Alice) 与 r2；r2 仍缺 Ready(Alice)。</text><rect x="1404" y="30" width="150" height="38" rx="19" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1479" y="56" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="middle">4 / 8</text><rect x="40" y="126" width="345" height="190" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/><rect x="40" y="126" width="345" height="46" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="0"/><path d="M40 156 v16 h345 v-16" fill="#ede9fe"/><text x="58" y="157" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="850" fill="#7c3aed" text-anchor="start">① Selected text window</text><text x="58" y="204" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">Selected Wmid</text><text x="58" y="232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">d2: Clear(Alice)</text><text x="58" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">r2: Ready∧Clear→Approved</text><rect x="405" y="126" width="345" height="190" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/><rect x="405" y="126" width="345" height="46" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="0"/><path d="M405 156 v16 h345 v-16" fill="#fef3c7"/><text x="423" y="157" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="850" fill="#d97706" text-anchor="start">② Candidate → Commit</text><text x="423" y="204" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">Fhat={Clear(Alice)}</text><text x="423" y="232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">Rhat={r2,r3,r4}</text><text x="423" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">all source-linked</text><rect x="770" y="126" width="345" height="190" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" filter="url(#shadow)"/><rect x="770" y="126" width="345" height="46" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="0"/><path d="M770 156 v16 h345 v-16" fill="#ccfbf1"/><text x="788" y="157" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="850" fill="#0f766e" text-anchor="start">③ Incremental LFP</text><text x="788" y="204" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">K={Clear(Alice)}</text><text x="788" y="232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">ΔK={Clear(Alice)}</text><text x="788" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">r2 missing Ready</text><rect x="1135" y="126" width="425" height="190" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="2.5" filter="url(#shadow)"/><rect x="1135" y="126" width="425" height="46" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="0"/><path d="M1135 156 v16 h425 v-16" fill="#dcfce7"/><text x="1153" y="157" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="850" fill="#15803d" text-anchor="start">④ Obligations / output</text><text x="1153" y="204" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">q ← Approved</text><text x="1153" y="232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">r2: has Clear</text><text x="1153" y="260" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0b1f33" text-anchor="start">missing {Ready(Alice)}</text><rect x="40" y="344" width="1520" height="428" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="64" y="380" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="800" fill="#526579" text-anchor="start">Worked example graph（canonical form 仅用于解释；实际输入是对应自然语言 records）</text><line x1="310" y1="590" x2="470" y2="590" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="367" y="555" width="54" height="38" rx="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="394" y="581" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">r1</text><line x1="530" y1="590" x2="690" y2="590" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="587" y="555" width="54" height="38" rx="19" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="614" y="581" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">r2</text><line x1="530" y1="710" x2="690" y2="620" stroke="#0891b2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="587" y="636" width="54" height="38" rx="19" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/><text x="614" y="662" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0891b2" text-anchor="middle">r2</text><line x1="750" y1="590" x2="920" y2="590" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-green)"/><rect x="812" y="555" width="54" height="38" rx="19" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="839" y="581" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">r3</text><path d="M920 555 C900 425 515 420 470 555" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-red)"/><rect x="677" y="479" width="54" height="38" rx="19" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="704" y="505" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">r4</text><rect x="166" y="551" width="144" height="78" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="238" y="588" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="850" fill="#526579" text-anchor="middle">Anchor(Alice)</text><text x="238" y="614" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#526579" text-anchor="middle">seed d1</text><rect x="386" y="671" width="144" height="78" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="6"/><text x="458" y="708" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="850" fill="#0f766e" text-anchor="middle">Clear(Alice)</text><text x="458" y="734" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#526579" text-anchor="middle">fact d2</text><rect x="428" y="551" width="144" height="78" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="4"/><text x="500" y="588" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="850" fill="#15803d" text-anchor="middle">Ready(Alice)</text><text x="500" y="614" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#526579" text-anchor="middle">recursive SCC</text><rect x="648" y="551" width="144" height="78" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="4"/><text x="720" y="588" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="850" fill="#15803d" text-anchor="middle">Approved(Alice)</text><text x="720" y="614" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#526579" text-anchor="middle">conjunction</text><rect x="878" y="551" width="144" height="78" rx="18" fill="#ffffff" stroke="#15803d" stroke-width="4"/><text x="950" y="588" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="850" fill="#15803d" text-anchor="middle">Certified(Alice)</text><text x="950" y="614" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#526579" text-anchor="middle">QUERY q</text><path d="M420 510 C500 455 890 455 1015 520 L1015 650 C900 705 520 700 420 650 Z" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="12 8"/><text x="720" y="493" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#7c3aed" text-anchor="middle">candidate / verified recursive SCC: {Ready, Approved, Certified}</text><rect x="1100" y="525" width="390" height="130" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1124" y="564" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="850" fill="#4f46e5" text-anchor="start">State invariant</text><text x="1124" y="598" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0b1f33" text-anchor="start">Fhat/Rhat/K only grow</text><text x="1124" y="627" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="750" fill="#0b1f33" text-anchor="start">L and O may change</text><rect x="40" y="798" width="1520" height="62" rx="14" fill="#0b1f33" stroke="#0b1f33" stroke-width="2"/><text x="800" y="838" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Obligation 保存 missing-premise set：Ready ∧ Clear 不能被压成任意一个 premise。</text></svg>