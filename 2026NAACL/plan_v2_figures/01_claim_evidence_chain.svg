  <rect width="2048" height="1270" fill="#ffffff"/><rect width="2048" height="1270" fill="url(#grid)" opacity="0.35"/><text x="64" y="72" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="800" fill="#10243a" text-anchor="start">PLANNED TESTS · 五条 claim，五条可证伪证据链</text><text x="64" y="112" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="500" fill="#586b80" text-anchor="start">以下均为实验计划与 decision gates，不代表已经得到结果。</text><line x1="64" y1="138" x2="1984" y2="138" stroke="#cad5e1" stroke-width="2" stroke-linecap="round"/><rect x="64" y="170" width="405" height="62" rx="13" fill="#0b2a46" stroke="#0b2a46" stroke-width="2"/><text x="266.5" y="211" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">论文必须证明什么</text><rect x="515" y="170" width="555" height="62" rx="13" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="792.5" y="211" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">决定性实验</text><rect x="1122" y="170" width="525" height="62" rx="13" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="1384.5" y="211" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">主指标 / 产物</text><rect x="1695" y="170" width="289" height="62" rx="13" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="1839.5" y="211" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">不过关就怎样</text><rect x="64" y="254" width="405" height="154" rx="18" fill="#fee2e2" stroke="#c62828" stroke-width="2.5" filter="url(#shadow)"/><rect x="82" y="272" width="70" height="38" rx="19" fill="#ffffff" st