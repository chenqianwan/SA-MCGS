nt-size="20" font-weight="600" fill="#10243a" text-anchor="start">冻结方法跨 topology / language / model</text><text x="539" y="862" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#10243a" text-anchor="start">PW→ParaRules/human；external 单独降级</text><rect x="1122" y="776" width="525" height="154" rx="18" fill="#ffffff" stroke="#cad5e1" stroke-width="2"/><text x="1146" y="827" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#10243a" text-anchor="start">逐 block effect + method×condition interaction</text><text x="1146" y="862" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#10243a" text-anchor="start">snapshot/hash + group split + adapters</text><rect x="1695" y="776" width="289" height="154" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="1839.5" y="827" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="middle">只在模板/弱模型有效</text><text x="1839.5" y="862" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="middle">→ 收窄 claim</text><line x1="477" y1="853" x2="505" y2="853" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1078" y1="853" x2="1112" y2="853" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1655" y1="853" x2="1685" y2="853" stroke="#15803d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="64" y="950" width="405" height="154" rx="18" fill="#fef3c7" stroke="#c66a05" stroke-width="2.5" filter="url(#shadow)"/><rect x="82" y="968" width="70" height="38" rx="19" fill="#ffffff" stroke="#c66a05" stroke-width="1.5"/><text x="117" y="994" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#c66a05" text-anchor="middle">C5</text><text x="169" y="997" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#10243a" text-anchor="start">结论可信且可复现</text><text x="169" y="1025" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#10243a" text-anchor="start">proof 不是对错误解析的</text><text x="169" y="1053" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#10243a" text-anchor="start">自我验证</text><rect x="515" y="950" width="555" height="154" rx="18" fill="#ffffff" stroke="#cad5e1" stroke-width="2"/><text x="539" y="1001" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#10243a" text-anchor="start">gold-parse diagnostic + 150–200 span 人审</text><text x="539" y="1036" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#10243a" text-anchor="start">clustered stats；error/abstention/cost audit</text><rect x="1122" y="950" width="525" height="154" rx="18" fill="#ffffff" stroke="#cad5e1" stroke-width="2"/><text x="1146" y="1001" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#10243a" text-anchor="start">program-relative verifier；source precision / agreement</text><text x="1146" y="1036" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#10243a" text-anchor="start">code、prompts、traces、licenses、limitations</text><rect x="1695" y="950" width="289" height="154" rx="18" fill="#fef3c7" stroke="#c66a05" stroke-width="2"/><text x="1839.5" y="1001" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="middle">解析/许可/统计不可审计</text><text x="1839.5" y="1036" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="750" fill="#10243a" text-anchor="middle">→ 不能提交</text><line x1="477" y1="1027" x2="505" y2="1027" stroke="#c66a05" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1078" y1="1027" x2="1112" y2="1027" stroke="#c66a05" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1655" y1="1027" x2="1685" y2="1027" stroke="#c66a05" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="64" y="1134" width="1920" height="80" rx="18" fill="#0b2a46" stroke="#0b2a46" stroke-width="2"/><text x="1024" y="1185" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Main-conference case = 新失败模式 × 不可替代的方法 × 跨条件因果一致性 × 可审计证据</text></svg>