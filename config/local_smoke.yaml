# Smoke test config — Ollama llama3.1:8B local model
# Reduced parameters for fast iteration

llm:
  provider: "local"
  model: "qwen2.5:14b"
  base_url: "http://localhost:11434/v1"
  max_concurrent_calls: 4
  timeout: 180

parsing:
  max_clause_length: 2000
  classify_with_llm: false

graph:
  max_clauses_per_batch: 20
  min_dependency_weight: 0.3

graph_pruning:
  enabled: true
  noise_weight_threshold: 0.35
  remove_duplicate_reasoning: true
  hierarchy_violation_threshold: 0.6
  ib_compression_ratio: 0.15
  ib_beta: 1.0

scc:
  num_samples: 5
  temperature: 0.8

pruning:
  variance_threshold: 0.001
  influence_threshold: 0.3
  risk_dimensions:
    - financial_exposure
    - liability_scope
    - termination_risk
    - compliance_burden
    - ambiguity

mcgs:
  num_rollouts: 5
  ucb_exploration_weight: 1.414
  early_stopping: true
  convergence_window: 5
  convergence_threshold: 0.02

aggregation:
  high_risk_threshold: 0.7
  high_uncertainty_threshold: 0.15

quantlaw:
  edge_type_field: "edge_type"
  hierarchy_edge_types:
    - containment
    - hierarchy
    - part_of
  jurisdictions:
    - de

logging:
  level: "INFO"
