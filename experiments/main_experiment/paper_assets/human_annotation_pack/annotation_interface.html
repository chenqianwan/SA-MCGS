bsatz 1, 3, 4 und 6 auf folgende Verträge anzuwenden: 1.notariell beurkundete Verträge a)über Finanzdienstleistungen, die außerhalb von Geschäftsräumen geschlossen werden,b)die keine Verträge über Finanzdienstleistungen sind; für Verträge, für die das Gesetz die notarielle Beurkundung des Vertrags oder einer Vertragserklärung nicht vorschreibt, gilt dies nur, wenn der Notar darüber belehrt, dass die Informationspflichten nach § 312d Absatz 1 und das Widerrufsrecht nach § 312g Absatz 1 entfallen,2.Verträge über die Begründung, den Erwerb oder die Übertragung von Eigentum oder anderen Rechten an Grundstücken,3.Verbraucherbauverträge nach § 650i Absatz 1,4.(weggefallen)5.(weggefallen)6.Verträge über Teilzeit-Wohnrechte, langfristige Urlaubsprodukte, Vermittlungen und Tauschsysteme nach den §§ 481 bis 481b,7.Behandlungsverträge nach § 630a,8.Verträge über die Lieferung von Lebensmitteln, Getränken oder sonstigen Haushaltsgegenständen des täglichen Bedarfs, die am Wohnsitz, am Aufenthaltsort oder am Arbeitsplatz eines Verbrauchers von einem Unternehmer im Rahmen häufiger und regelmäßiger Fahrten geliefert werden,9.Verträge, die unter Verwendung von Warenautomaten und automatisierten Geschäftsräumen geschlossen werden,10.Verträge, die mit Betreibern von Telekommunikationsmitteln mit Hilfe öffentlicher Münz- und Kartentelefone zu deren Nutzung geschlossen werden,11.Verträge zur Nutzung einer einzelnen von einem Verbraucher hergestellten Telefon-, Internet- oder Telefaxverbindung,12.außerhalb von Geschäftsräumen geschlossene Verträge, bei denen die Leistung bei Abschluss der Verhandlungen sofort erbracht und bezahlt wird und das vom Verbraucher zu zahlende Entgelt 40 Euro nicht überschreitet, und13.Verträge über den Verkauf beweglicher Sachen auf Grund von Zwangsvollstreckungsmaßnahmen oder anderen gerichtlichen Maßnahmen.(3) Auf Verträge über soziale Dienstleistungen, wie Kinderbetreuung oder Unterstützung von dauerhaft oder vorübergehend hilfsbedürftigen Familien oder Personen, einschließlich Langzeitpflege, sind von den Vorschriften der Kapitel 1 und 2 dieses Untertitels nur folgende anzuwenden: 1.die Definitionen der außerhalb von Geschäftsräumen geschlossenen Verträge und der Fernabsatzverträge nach den §§ 312b und 312c,2.§ 312a Absatz 1 über die Pflicht zur Offenlegung bei Telefonanrufen,3.§ 312a Absatz 3 über die Wirksamkeit der Vereinbarung, die auf eine über das vereinbarte Entgelt für die Hauptleistung hinausgehende Zahlung gerichtet ist,4.§ 312a Absatz 4 über die Wirksamkeit der Vereinbarung eines Entgelts für die Nutzung von Zahlungsmitteln,5.§ 312a Absatz 6,6.§ 312d Absatz 1 in Verbindung mit Artikel 246a § 1 Absatz 2 und 3 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche über die Pflicht zur Information über das Widerrufsrecht und7.§ 312g über das Widerrufsrecht.(4) Auf Verträge über die Vermietung von Wohnraum sind von den Vorschriften der Kapitel 1 und 2 dieses Untertitels nur die in Absatz 3 Nummer 1 bis 7 genannten Bestimmungen anzuwenden. Die in Absatz 3 Nummer 1, 6 und 7 genannten Bestimmungen sind jedoch nicht auf die Begründung eines Mietverhältnisses über Wohnraum anzuwenden, wenn der Mieter die Wohnung zuvor besichtigt hat.(5) Bei Vertragsverhältnissen über Bankdienstleistungen sowie Dienstleistungen im Zusammenhang mit einer Kreditgewährung, Versicherung, Altersversorgung von Einzelpersonen, Geldanlage oder Zahlung (Finanzdienstleistungen), die eine erstmalige Vereinbarung mit daran anschließenden aufeinanderfolgenden Vorgängen oder eine daran anschließende Reihe getrennter, in einem zeitlichen Zusammenhang stehender Vorgänge gleicher Art umfassen, sind die Vorschriften der Kapitel 1 und 2 dieses Untertitels nur auf die erste Vereinbarung anzuwenden. § 312a Absatz 1, 3, 4 und 6 ist daneben auf jeden Vorgang anzuwenden. Wenn die in Satz 1 genannten Vorgänge ohne eine solche Vereinbarung aufeinanderfolgen, gelten die Vorschriften über Informationspflichten des Unternehmers nur für den ersten Vorgang. Findet jedoch länger als ein Jahr kein Vorgang der gleichen Art mehr statt, so gilt der nächste Vorgang als der erste Vorgang einer neuen Reihe im Sinne von Satz 3.(6) Von den Vorschriften der Kapitel 1 und 2 dieses Untertitels ist auf Verträge über Versicherungen sowie auf Verträge über deren Vermittlung nur § 312a Absatz 3, 4 und 6 anzuwenden.(7) Auf Pauschalreiseverträge nach den §§ 651a und 651c sind von den Vorschriften dieses Untertitels nur § 312a Absatz 3 bis 6, die §§ 312i, 312j Absatz 2 bis 5 und § 312m anzuwenden; diese Vorschriften finden auch Anwendung, wenn der Reisende kein Verbraucher ist. Ist der Reisende ein Verbraucher, ist auf Pauschalreiseverträge nach § 651a, die außerhalb von Geschäftsräumen geschlossen worden sind, auch § 312g Absatz 1 anzuwenden, es sei denn, die mündlichen Verhandlungen, auf denen der Vertragsschluss beruht, sind auf vorhergehende Bestellung des Verbrauchers geführt worden.(8) Auf Verträge über die Beförderung von Personen ist von den Vorschriften der Kapitel 1 und 2 dieses Untertitels nur § 312a Absatz 1 und 3 bis 6 anzuwenden.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.3307692307692307; visit_count=13; conflict_count=13; is_oc_detected=False", "display_id": "段落 01", "short_id": "bgb_312", "role_label_zh": "context"}, {"index": 2, "node_id": "bgb_312f", "title": "§312f Abschriften und Bestätigungen", "text_en": "§312f Abschriften und Bestätigungen\n\n(1) Bei außerhalb von Geschäftsräumen geschlossenen Verträgen ist der Unternehmer verpflichtet, dem Verbraucher alsbald auf Papier zur Verfügung zu stellen 1.eine Abschrift eines Vertragsdokuments, das von den Vertragsschließenden so unterzeichnet wurde, dass ihre Identität erkennbar ist, oder2.eine Bestätigung des Vertrags, in der der Vertragsinhalt wiedergegeben ist.Wenn der Verbraucher zustimmt, kann für die Abschrift oder die Bestätigung des Vertrags auch ein anderer dauerhafter Datenträger verwendet werden. Die Bestätigung nach Satz 1 muss die in Artikel 246a des Einführungsgesetzes zum Bürgerlichen Gesetzbuche genannten Angaben nur enthalten, wenn der Unternehmer dem Verbraucher diese Informationen nicht bereits vor Vertragsschluss in Erfüllung seiner Informationspflichten nach § 312d Absatz 1 auf einem dauerhaften Datenträger zur Verfügung gestellt hat.(2) Bei Fernabsatzverträgen ist der Unternehmer verpflichtet, dem Verbraucher eine Bestätigung des Vertrags, in der der Vertragsinhalt wiedergegeben ist, innerhalb einer angemessenen Frist nach Vertragsschluss, spätestens jedoch bei der Lieferung der Ware oder bevor mit der Ausführung der Dienstleistung begonnen wird, auf einem dauerhaften Datenträger zur Verfügung zu stellen. Die Bestätigung nach Satz 1 muss die in Artikel 246a des Einführungsgesetzes zum Bürgerlichen Gesetzbuche genannten Angaben enthalten, es sei denn, der Unternehmer hat dem Verbraucher diese Informationen bereits vor Vertragsschluss in Erfüllung seiner Informationspflichten nach § 312d Absatz 1 auf einem dauerhaften Datenträger zur Verfügung gestellt.(3) Bei Verträgen über digitale Inhalte (§ 327 Absatz 2 Satz 1), die nicht auf einem körperlichen Datenträger bereitgestellt werden, ist auf der Abschrift oder in der Bestätigung des Vertrags nach den Absätzen 1 und 2 gegebenenfalls auch festzuhalten, dass der Verbraucher vor Ausführung des Vertrags 1.ausdrücklich zugestimmt hat, dass der Unternehmer mit der Ausführung des Vertrags vor Ablauf der Widerrufsfrist beginnt, und2.seine Kenntnis davon bestätigt hat, dass er durch seine Zustimmung mit Beginn der Ausführung des Vertrags sein Widerrufsrecht verliert.(4) Diese Vorschrift ist nicht anwendbar auf Verträge über Finanzdienstleistungen.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.2833333333333334; visit_count=6; conflict_count=4; is_oc_detected=False", "display_id": "段落 02", "short_id": "bgb_312f", "role_label_zh": "context"}, {"index": 3, "node_id": "bgb_312g", "title": "§312g Widerrufsrecht", "text_en": "§312g Widerrufsrecht\n\n(1) Dem Verbraucher steht bei außerhalb von Geschäftsräumen geschlossenen Verträgen und bei Fernabsatzverträgen ein Widerrufsrecht gemäß § 355 zu.(2) Das Widerrufsrecht besteht, soweit die Parteien nichts anderes vereinbart haben, nicht bei folgenden Verträgen: 1.Verträge zur Lieferung von Waren, die nicht vorgefertigt sind und für deren Herstellung eine individuelle Auswahl oder Bestimmung durch den Verbraucher maßgeblich ist oder die eindeutig auf die persönlichen Bedürfnisse des Verbrauchers zugeschnitten sind,2.Verträge zur Lieferung von Waren, die schnell verderben können oder deren Verfallsdatum schnell überschritten würde,3.Verträge zur Lieferung versiegelter Waren, die aus Gründen des Gesundheitsschutzes oder der Hygiene nicht zur Rückgabe geeignet sind, wenn ihre Versiegelung nach der Lieferung entfernt wurde,4.Verträge zur Lieferung von Waren, wenn diese nach der Lieferung auf Grund ihrer Beschaffenheit untrennbar mit anderen Gütern vermischt wurden,5.Verträge zur Lieferung alkoholischer Getränke, deren Preis bei Vertragsschluss vereinbart wurde, die aber frühestens 30 Tage nach Vertragsschluss geliefert werden können und deren aktueller Wert von Schwankungen auf dem Markt abhängt, auf die der Unternehmer keinen Einfluss hat,6.Verträge zur Lieferung von Ton- oder Videoaufnahmen oder Computersoftware in einer versiegelten Packung, wenn die Versiegelung nach der Lieferung entfernt wurde,7.Verträge zur Lieferung von Zeitungen, Zeitschriften oder Illustrierten mit Ausnahme von Abonnement-Verträgen,8.Verträge zur Lieferung von Waren oder zur Erbringung von Dienstleistungen, einschließlich Finanzdienstleistungen, deren Preis von Schwankungen auf dem Finanzmarkt abhängt, auf die der Unternehmer keinen Einfluss hat und die innerhalb der Widerrufsfrist auftreten können, insbesondere Dienstleistungen im Zusammenhang mit Aktien, mit Anteilen an offenen Investmentvermögen im Sinne von § 1 Absatz 4 des Kapitalanlagegesetzbuchs und mit anderen handelbaren Wertpapieren, Devisen, Derivaten oder Geldmarktinstrumenten,9.Verträge zur Erbringung von Dienstleistungen in den Bereichen Beherbergung zu anderen Zwecken als zu Wohnzwecken, Beförderung von Waren, Kraftfahrzeugvermietung, Lieferung von Speisen und Getränken sowie zur Erbringung weiterer Dienstleistungen im Zusammenhang mit Freizeitbetätigungen, wenn der Vertrag für die Erbringung einen spezifischen Termin oder Zeitraum vorsieht,10.Verträge, die im Rahmen einer Vermarktungsform geschlossen werden, bei der der Unternehmer Verbrauchern, die persönlich anwesend sind oder denen diese Möglichkeit gewährt wird, Waren oder Dienstleistungen anbietet, und zwar in einem vom Versteigerer durchgeführten, auf konkurrierenden Geboten basierenden transparenten Verfahren, bei dem der Bieter, der den Zuschlag erhalten hat, zum Erwerb der Waren oder Dienstleistungen verpflichtet ist (öffentlich zugängliche Versteigerung),11.Verträge, bei denen der Verbraucher den Unternehmer ausdrücklich aufgefordert hat, ihn aufzusuchen, um dringende Reparatur- oder Instandhaltungsarbeiten vorzunehmen; dies gilt nicht hinsichtlich weiterer bei dem Besuch erbrachter Dienstleistungen, die der Verbraucher nicht ausdrücklich verlangt hat, oder hinsichtlich solcher bei dem Besuch gelieferter Waren, die bei der Instandhaltung oder Reparatur nicht unbedingt als Ersatzteile benötigt werden,12.Verträge zur Erbringung von Wett- und Lotteriedienstleistungen, es sei denn, dass der Verbraucher seine Vertragserklärung telefonisch abgegeben hat oder der Vertrag außerhalb von Geschäftsräumen geschlossen wurde, und13.notariell beurkundete Verträge; dies gilt für Fernabsatzverträge über Finanzdienstleistungen nur, wenn der Notar bestätigt, dass die Rechte des Verbrauchers aus § 312d Absatz 2 gewahrt sind.(3) Das Widerrufsrecht besteht ferner nicht bei Verträgen, bei denen dem Verbraucher bereits auf Grund der §§ 495, 506 bis 513 ein Widerrufsrecht nach § 355 zusteht, und nicht bei außerhalb von Geschäftsräumen geschlossenen Verträgen, bei denen dem Verbraucher bereits nach § 305 Absatz 1 bis 6 des Kapitalanlagegesetzbuchs ein Widerrufsrecht zusteht.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.32999999999999996; visit_count=20; conflict_count=7; is_oc_detected=False", "display_id": "段落 03", "short_id": "bgb_312g", "role_label_zh": "suggested"}, {"index": 4, "node_id": "bgb_327", "title": "§327 Anwendungsbereich", "text_en": "§327 Anwendungsbereich\n\n(1) Die Vorschriften dieses Untertitels sind auf Verbraucherverträge anzuwenden, welche die Bereitstellung digitaler Inhalte oder digitaler Dienstleistungen (digitale Produkte) durch den Unternehmer gegen Zahlung eines Preises zum Gegenstand haben. Preis im Sinne dieses Untertitels ist auch eine digitale Darstellung eines Werts.(2) Digitale Inhalte sind Daten, die in digitaler Form erstellt und bereitgestellt werden. Digitale Dienstleistungen sind Dienstleistungen, die dem Verbraucher 1.die Erstellung, die Verarbeitung oder die Speicherung von Daten in digitaler Form oder den Zugang zu solchen Daten ermöglichen, oder2.die gemeinsame Nutzung der vom Verbraucher oder von anderen Nutzern der entsprechenden Dienstleistung in digitaler Form hochgeladenen oder erstellten Daten oder sonstige Interaktionen mit diesen Daten ermöglichen.(3) Die Vorschriften dieses Untertitels sind auch auf Verbraucherverträge über die Bereitstellung digitaler Produkte anzuwenden, bei denen der Verbraucher dem Unternehmer personenbezogene Daten bereitstellt oder sich zu deren Bereitstellung verpflichtet, es sei denn, die Voraussetzungen des § 312 Absatz 1a Satz 2 liegen vor.(4) Die Vorschriften dieses Untertitels sind auch auf Verbraucherverträge anzuwenden, die digitale Produkte zum Gegenstand haben, welche nach den Spezifikationen des Verbrauchers entwickelt werden.(5) Die Vorschriften dieses Untertitels sind mit Ausnahme der §§ 327b und 327c auch auf Verbraucherverträge anzuwenden, welche die Bereitstellung von körperlichen Datenträgern, die ausschließlich als Träger digitaler Inhalte dienen, zum Gegenstand haben.(6) Die Vorschriften dieses Untertitels sind nicht anzuwenden auf: 1.Verträge über andere Dienstleistungen als digitale Dienstleistungen, unabhängig davon, ob der Unternehmer digitale Formen oder Mittel einsetzt, um das Ergebnis der Dienstleistung zu generieren oder es dem Verbraucher zu liefern oder zu übermitteln,2.Verträge über Telekommunikationsdienste im Sinne des § 3 Nummer 61 des Telekommunikationsgesetzes vom 23. Juni 2021 (BGBl. I S. 1858) mit Ausnahme von nummernunabhängigen interpersonellen Telekommunikationsdiensten im Sinne des § 3 Nummer 40 des Telekommunikationsgesetzes,3.Behandlungsverträge nach § 630a,4.Verträge über Glücksspieldienstleistungen, die einen geldwerten Einsatz erfordern und unter Zuhilfenahme elektronischer oder anderer Kommunikationstechnologien auf individuellen Abruf eines Empfängers erbracht werden,5.Verträge über Finanzdienstleistungen,6.Verträge über die Bereitstellung von Software, für die der Verbraucher keinen Preis zahlt und die der Unternehmer im Rahmen einer freien und quelloffenen Lizenz anbietet, sofern die vom Verbraucher bereitgestellten personenbezogenen Daten durch den Unternehmer ausschließlich zur Verbesserung der Sicherheit, der Kompatibilität oder der Interoperabilität der vom Unternehmer angebotenen Software verarbeitet werden,7.Verträge über die Bereitstellung digitaler Inhalte, wenn die digitalen Inhalte der Öffentlichkeit auf eine andere Weise als durch Signalübermittlung als Teil einer Darbietung oder Veranstaltung zugänglich gemacht werden,8.Verträge über die Bereitstellung von Informationen im Sinne des Informationsweiterverwendungsgesetzes vom 13. Dezember 2006 (BGBl. I S. 2913), das durch Artikel 1 des Gesetzes vom 8. Juli 2015 (BGBl. I S. 1162) geändert worden ist.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 这段在多次小范围检查中被反复注意到，所以建议先看；最终判断仍以你的标注为准。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": false, "in_oc": true, "in_context": true, "injected_note": "", "stats": "mean_score=0.423529411764706; visit_count=17; conflict_count=18; is_oc_detected=True", "display_id": "段落 04", "short_id": "bgb_327", "role_label_zh": "suggested"}, {"index": 5, "node_id": "bgb_327b", "title": "§327b Bereitstellung digitaler Produkte", "text_en": "§327b Bereitstellung digitaler Produkte\n\n(1) Ist der Unternehmer durch einen Verbrauchervertrag gemäß § 327 oder § 327a dazu verpflichtet, dem Verbraucher ein digitales Produkt bereitzustellen, so gelten für die Bestimmung der Leistungszeit sowie für die Art und Weise der Bereitstellung durch den Unternehmer die nachfolgenden Vorschriften.(2) Sofern die Vertragsparteien keine Zeit für die Bereitstellung des digitalen Produkts nach Absatz 1 vereinbart haben, kann der Verbraucher die Bereitstellung unverzüglich nach Vertragsschluss verlangen, der Unternehmer sie sofort bewirken.(3) Ein digitaler Inhalt ist bereitgestellt, sobald der digitale Inhalt oder die geeigneten Mittel für den Zugang zu diesem oder das Herunterladen des digitalen Inhalts dem Verbraucher unmittelbar oder mittels einer von ihm hierzu bestimmten Einrichtung zur Verfügung gestellt oder zugänglich gemacht worden ist.(4) Eine digitale Dienstleistung ist bereitgestellt, sobald die digitale Dienstleistung dem Verbraucher unmittelbar oder mittels einer von ihm hierzu bestimmten Einrichtung zugänglich gemacht worden ist.(5) Wenn der Unternehmer durch den Vertrag zu einer Reihe einzelner Bereitstellungen verpflichtet ist, gelten die Absätze 2 bis 4 für jede einzelne Bereitstellung innerhalb der Reihe.(6) Die Beweislast für die nach den Absätzen 1 bis 4 erfolgte Bereitstellung trifft abweichend von § 363 den Unternehmer.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": false, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.19999999999999998; visit_count=10; conflict_count=2; is_oc_detected=False", "display_id": "段落 05", "short_id": "bgb_327b", "role_label_zh": "suggested"}, {"index": 6, "node_id": "bgb_327c", "title": "§327c Rechte bei unterbliebener Bereitstellung", "text_en": "§327c Rechte bei unterbliebener Bereitstellung\n\n(1) Kommt der Unternehmer seiner fälligen Verpflichtung zur Bereitstellung des digitalen Produkts auf Aufforderung des Verbrauchers nicht unverzüglich nach, so kann der Verbraucher den Vertrag beenden. Nach einer Aufforderung gemäß Satz 1 kann eine andere Zeit für die Bereitstellung nur ausdrücklich vereinbart werden.(2) Liegen die Voraussetzungen für eine Beendigung des Vertrags nach Absatz 1 Satz 1 vor, so kann der Verbraucher nach den §§ 280 und 281 Absatz 1 Satz 1 Schadensersatz oder nach § 284 Ersatz vergeblicher Aufwendungen verlangen, wenn die Voraussetzungen dieser Vorschriften vorliegen. § 281 Absatz 1 Satz 1 ist mit der Maßgabe anzuwenden, dass an die Stelle der Bestimmung einer angemessenen Frist die Aufforderung nach Absatz 1 Satz 1 tritt. Ansprüche des Verbrauchers auf Schadensersatz nach den §§ 283 und 311a Absatz 2 bleiben unberührt.(3) Die Aufforderung nach Absatz 1 Satz 1 und Absatz 2 Satz 2 ist entbehrlich, wenn 1.der Unternehmer die Bereitstellung verweigert,2.es nach den Umständen eindeutig zu erkennen ist, dass der Unternehmer das digitale Produkt nicht bereitstellen wird, oder3.der Unternehmer die Bereitstellung bis zu einem bestimmten Termin oder innerhalb einer bestimmten Frist nicht bewirkt, obwohl vereinbart war oder es sich für den Unternehmer aus eindeutig erkennbaren, den Vertragsabschluss begleitenden Umständen ergeben konnte, dass die termin- oder fristgerechte Bereitstellung für den Verbraucher wesentlich ist.In den Fällen des Satzes 1 ist die Mahnung gemäß § 286 stets entbehrlich.(4) Für die Beendigung des Vertrags nach Absatz 1 Satz 1 und deren Rechtsfolgen sind die §§ 327o und 327p entsprechend anzuwenden. Das Gleiche gilt für den Fall, dass der Verbraucher in den Fällen des Absatzes 2 Schadensersatz statt der ganzen Leistung verlangt. § 325 gilt entsprechend.(5) § 218 ist auf die Vertragsbeendigung nach Absatz 1 Satz 1 entsprechend anzuwenden.(6) Sofern der Verbraucher den Vertrag nach Absatz 1 Satz 1 beenden kann, kann er sich im Hinblick auf alle Bestandteile des Paketvertrags vom Vertrag lösen, wenn er an dem anderen Teil des Paketvertrags ohne das nicht bereitgestellte digitale Produkt kein Interesse hat. Satz 1 ist nicht auf Paketverträge anzuwenden, bei denen der andere Bestandteil ein Telekommunikationsdienst im Sinne des § 3 Nummer 61 des Telekommunikationsgesetzes ist.(7) Sofern der Verbraucher den Vertrag nach Absatz 1 Satz 1 beenden kann, kann er sich im Hinblick auf alle Bestandteile eines Vertrags nach § 327a Absatz 2 vom Vertrag lösen, wenn aufgrund des nicht bereitgestellten digitalen Produkts sich die Sache nicht zur gewöhnlichen Verwendung eignet.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.33333333333333337; visit_count=9; conflict_count=3; is_oc_detected=False", "display_id": "段落 06", "short_id": "bgb_327c", "role_label_zh": "context"}, {"index": 7, "node_id": "bgb_327m", "title": "§327m Vertragsbeendigung und Schadensersatz", "text_en": "§327m Vertragsbeendigung und Schadensersatz\n\n(1) Ist das digitale Produkt mangelhaft, so kann der Verbraucher den Vertrag gemäß § 327o beenden, wenn 1.der Nacherfüllungsanspruch gemäß § 327l Absatz 2 ausgeschlossen ist,2.der Nacherfüllungsanspruch des Verbrauchers nicht gemäß § 327l Absatz 1 erfüllt wurde,3.sich trotz der vom Unternehmer versuchten Nacherfüllung ein Mangel zeigt,4.der Mangel derart schwerwiegend ist, dass die sofortige Vertragsbeendigung gerechtfertigt ist,5.der Unternehmer die gemäß § 327l Absatz 1 Satz 2 ordnungsgemäße Nacherfüllung verweigert hat, oder6.es nach den Umständen offensichtlich ist, dass der Unternehmer nicht gemäß § 327l Absatz 1 Satz 2 ordnungsgemäß nacherfüllen wird.(2) Eine Beendigung des Vertrags nach Absatz 1 ist ausgeschlossen, wenn der Mangel unerheblich ist. Dies gilt nicht für Verbraucherverträge im Sinne des § 327 Absatz 3.(3) In den Fällen des Absatzes 1 Nummer 1 bis 6 kann der Verbraucher unter den Voraussetzungen des § 280 Absatz 1 Schadensersatz statt der Leistung verlangen. § 281 Absatz 1 Satz 3 und Absatz 4 sind entsprechend anzuwenden. Verlangt der Verbraucher Schadensersatz statt der ganzen Leistung, so ist der Unternehmer zur Rückforderung des Geleisteten nach den §§ 327o und 327p berechtigt. § 325 gilt entsprechend.(4) Sofern der Verbraucher den Vertrag nach Absatz 1 beenden kann, kann er sich im Hinblick auf alle Bestandteile des Paketvertrags vom Vertrag lösen, wenn er an dem anderen Teil des Paketvertrags ohne das mangelhafte digitale Produkt kein Interesse hat. Satz 1 ist nicht auf Paketverträge anzuwenden, bei denen der andere Bestandteil ein Telekommunikationsdienst im Sinne des § 3 Nummer 61 des Telekommunikationsgesetzes ist.(5) Sofern der Verbraucher den Vertrag nach Absatz 1 beenden kann, kann er sich im Hinblick auf alle Bestandteile eines Vertrags nach § 327a Absatz 2 vom Vertrag lösen, wenn aufgrund des Mangels des digitalen Produkts sich die Sache nicht zur gewöhnlichen Verwendung eignet.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.38749999999999996; visit_count=8; conflict_count=6; is_oc_detected=False", "display_id": "段落 07", "short_id": "bgb_327m", "role_label_zh": "context"}, {"index": 8, "node_id": "bgb_327n", "title": "§327n Minderung", "text_en": "§327n Minderung\n\n(1) Statt den Vertrag nach § 327m Absatz 1 zu beenden, kann der Verbraucher den Preis durch Erklärung gegenüber dem Unternehmer mindern. Der Ausschlussgrund des § 327m Absatz 2 Satz 1 findet keine Anwendung. § 327o Absatz 1 ist entsprechend anzuwenden.(2) Bei der Minderung ist der Preis in dem Verhältnis herabzusetzen, in welchem zum Zeitpunkt der Bereitstellung der Wert des digitalen Produkts in mangelfreiem Zustand zu dem wirklichen Wert gestanden haben würde. Bei Verträgen über die dauerhafte Bereitstellung eines digitalen Produkts ist der Preis unter entsprechender Anwendung des Satzes 1 nur anteilig für die Dauer der Mangelhaftigkeit herabzusetzen.(3) Die Minderung ist, soweit erforderlich, durch Schätzung zu ermitteln.(4) Hat der Verbraucher mehr als den geminderten Preis gezahlt, so hat der Unternehmer den Mehrbetrag zu erstatten. Der Mehrbetrag ist unverzüglich, auf jeden Fall aber innerhalb von 14 Tagen zu erstatten. Die Frist beginnt mit dem Zugang der Minderungserklärung beim Unternehmer. Für die Erstattung muss der Unternehmer dasselbe Zahlungsmittel verwenden, das der Verbraucher bei der Zahlung verwendet hat, es sei denn, es wurde ausdrücklich etwas anderes vereinbart und dem Verbraucher entstehen durch die Verwendung eines anderen Zahlungsmittels keine Kosten. Der Unternehmer kann vom Verbraucher keinen Ersatz für die Kosten verlangen, die ihm für die Erstattung des Mehrbetrags entstehen.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": false, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.32857142857142857; visit_count=7; conflict_count=8; is_oc_detected=False", "display_id": "段落 08", "short_id": "bgb_327n", "role_label_zh": "suggested"}, {"index": 9, "node_id": "bgb_327o", "title": "§327o Erklärung und Rechtsfolgen der Vertragsbeendigung", "text_en": "§327o Erklärung und Rechtsfolgen der Vertragsbeendigung\n\n(1) Die Beendigung des Vertrags erfolgt durch Erklärung gegenüber dem Unternehmer, in welcher der Entschluss des Verbrauchers zur Beendigung zum Ausdruck kommt. § 351 ist entsprechend anzuwenden.(2) Im Fall der Vertragsbeendigung hat der Unternehmer dem Verbraucher die Zahlungen zu erstatten, die der Verbraucher zur Erfüllung des Vertrags geleistet hat. Für Leistungen, die der Unternehmer aufgrund der Vertragsbeendigung nicht mehr zu erbringen hat, erlischt sein Anspruch auf Zahlung des vereinbarten Preises.(3) Abweichend von Absatz 2 Satz 2 erlischt bei Verträgen über die dauerhafte Bereitstellung eines digitalen Produkts der Anspruch des Unternehmers auch für bereits erbrachte Leistungen, jedoch nur für denjenigen Teil des Bereitstellungszeitraums, in dem das digitale Produkt mangelhaft war. Der gezahlte Preis für den Zeitraum, für den der Anspruch nach Satz 1 entfallen ist, ist dem Verbraucher zu erstatten.(4) Für die Erstattungen nach den Absätzen 2 und 3 ist § 327n Absatz 4 Satz 2 bis 5 entsprechend anzuwenden.(5) Der Verbraucher ist verpflichtet, einen vom Unternehmer bereitgestellten körperlichen Datenträger an diesen unverzüglich zurückzusenden, wenn der Unternehmer dies spätestens 14 Tage nach Vertragsbeendigung verlangt. Der Unternehmer trägt die Kosten der Rücksendung. § 348 ist entsprechend anzuwenden.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": false, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.3375; visit_count=8; conflict_count=4; is_oc_detected=False", "display_id": "段落 09", "short_id": "bgb_327o", "role_label_zh": "suggested"}, {"index": 10, "node_id": "bgb_356", "title": "§356 Widerrufsrecht bei außerhalb von Geschäftsräumen geschlossenen Verträgen und Fernabsatzverträgen", "text_en": "§356 Widerrufsrecht bei außerhalb von Geschäftsräumen geschlossenen Verträgen und Fernabsatzverträgen\n\n(1) Der Unternehmer kann dem Verbraucher die Möglichkeit einräumen, das Muster-Widerrufsformular nach Anlage 2 zu Artikel 246a § 1 Absatz 2 Satz 1 Nummer 1 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche oder eine andere eindeutige Widerrufserklärung auf der Webseite des Unternehmers auszufüllen und zu übermitteln. Macht der Verbraucher von dieser Möglichkeit Gebrauch, muss der Unternehmer dem Verbraucher den Zugang des Widerrufs unverzüglich auf einem dauerhaften Datenträger bestätigen.(2) Die Widerrufsfrist beginnt 1.bei einem Verbrauchsgüterkauf, a)der nicht unter die Buchstaben b bis d fällt, sobald der Verbraucher oder ein von ihm benannter Dritter, der nicht Frachtführer ist, die Waren erhalten hat,b)bei dem der Verbraucher mehrere Waren im Rahmen einer einheitlichen Bestellung bestellt hat und die Waren getrennt geliefert werden, sobald der Verbraucher oder ein von ihm benannter Dritter, der nicht Frachtführer ist, die letzte Ware erhalten hat,c)bei dem die Ware in mehreren Teilsendungen oder Stücken geliefert wird, sobald der Verbraucher oder ein vom Verbraucher benannter Dritter, der nicht Frachtführer ist, die letzte Teilsendung oder das letzte Stück erhalten hat,d)der auf die regelmäßige Lieferung von Waren über einen festgelegten Zeitraum gerichtet ist, sobald der Verbraucher oder ein von ihm benannter Dritter, der nicht Frachtführer ist, die erste Ware erhalten hat,2.bei einem Vertrag, der die nicht in einem begrenzten Volumen oder in einer bestimmten Menge angebotene Lieferung von Wasser, Gas oder Strom, die Lieferung von Fernwärme oder die Lieferung von nicht auf einem körperlichen Datenträger befindlichen digitalen Inhalten zum Gegenstand hat, mit Vertragsschluss.(3) Die Widerrufsfrist beginnt nicht, bevor der Unternehmer den Verbraucher entsprechend den Anforderungen des Artikels 246a § 1 Absatz 2 Satz 1 Nummer 1 oder des Artikels 246b § 2 Absatz 1 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche unterrichtet hat. Das Widerrufsrecht erlischt spätestens zwölf Monate und 14 Tage nach dem in Absatz 2 oder § 355 Absatz 2 Satz 2 genannten Zeitpunkt. Satz 2 ist auf Verträge über Finanzdienstleistungen nicht anwendbar.(4) Das Widerrufsrecht erlischt bei Verträgen über die Erbringung von Dienstleistungen auch unter folgenden Voraussetzungen: 1.bei einem Vertrag, der den Verbraucher nicht zur Zahlung eines Preises verpflichtet, wenn der Unternehmer die Dienstleistung vollständig erbracht hat,2.bei einem Vertrag, der den Verbraucher zur Zahlung eines Preises verpflichtet, mit der vollständigen Erbringung der Dienstleistung, wenn der Verbraucher vor Beginn der Erbringung a)ausdrücklich zugestimmt hat, dass der Unternehmer mit der Erbringung der Dienstleistung vor Ablauf der Widerrufsfrist beginnt,b)bei einem außerhalb von Geschäftsräumen geschlossenen Vertrag die Zustimmung nach Buchstabe a auf einem dauerhaften Datenträger übermittelt hat undc)seine Kenntnis davon bestätigt hat, dass sein Widerrufsrecht mit vollständiger Vertragserfüllung durch den Unternehmer erlischt,3.bei einem Vertrag, bei dem der Verbraucher den Unternehmer ausdrücklich aufgefordert hat, ihn aufzusuchen, um Reparaturarbeiten auszuführen, mit der vollständigen Erbringung der Dienstleistung, wenn der Verbraucher die in Nummer 2 Buchstabe a und b genannten Voraussetzungen erfüllt hat,4.bei einem Vertrag über die Erbringung von Finanzdienstleistungen, wenn der Vertrag von beiden Seiten auf ausdrücklichen Wunsch des Verbrauchers vollständig erfüllt ist, bevor der Verbraucher sein Widerrufsrecht ausübt.(5) Das Widerrufsrecht erlischt bei Verträgen über die Bereitstellung von nicht auf einem körperlichen Datenträger befindlichen digitalen Inhalten auch unter folgenden Voraussetzungen: 1.bei einem Vertrag, der den Verbraucher nicht zur Zahlung eines Preises verpflichtet, wenn der Unternehmer mit der Vertragserfüllung begonnen hat,2.bei einem Vertrag, der den Verbraucher zur Zahlung eines Preises verpflichtet, wenn a)der Unternehmer mit der Vertragserfüllung begonnen hat,b)der Verbraucher ausdrücklich zugestimmt hat, dass der Unternehmer mit der Vertragserfüllung vor Ablauf der Widerrufsfrist beginnt,c)der Verbraucher seine Kenntnis davon bestätigt hat, dass durch seine Zustimmung nach Buchstabe b mit Beginn der Vertragserfüllung sein Widerrufsrecht erlischt, undd)der Unternehmer dem Verbraucher eine Bestätigung gemäß § 312f zur Verfügung gestellt hat.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": true, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.39999999999999997; visit_count=5; conflict_count=2; is_oc_detected=False", "display_id": "段落 10", "short_id": "bgb_356", "role_label_zh": "suggested"}, {"index": 11, "node_id": "bgb_358", "title": "§358 Mit dem widerrufenen Vertrag verbundener Vertrag", "text_en": "§358 Mit dem widerrufenen Vertrag verbundener Vertrag\n\n(1) Hat der Verbraucher seine auf den Abschluss eines Vertrags über die Lieferung einer Ware oder die Erbringung einer anderen Leistung durch einen Unternehmer gerichtete Willenserklärung wirksam widerrufen, so ist er auch an seine auf den Abschluss eines mit diesem Vertrag verbundenen Darlehensvertrags gerichtete Willenserklärung nicht mehr gebunden.(2) Hat der Verbraucher seine auf den Abschluss eines Darlehensvertrags gerichtete Willenserklärung auf Grund des § 495 Absatz 1 oder des § 514 Absatz 2 Satz 1 wirksam widerrufen, so ist er auch nicht mehr an diejenige Willenserklärung gebunden, die auf den Abschluss eines mit diesem Darlehensvertrag verbundenen Vertrags über die Lieferung einer Ware oder die Erbringung einer anderen Leistung gerichtet ist.(3) Ein Vertrag über die Lieferung einer Ware oder über die Erbringung einer anderen Leistung und ein Darlehensvertrag nach den Absätzen 1 oder 2 sind verbunden, wenn das Darlehen ganz oder teilweise der Finanzierung des anderen Vertrags dient und beide Verträge eine wirtschaftliche Einheit bilden. Eine wirtschaftliche Einheit ist insbesondere anzunehmen, wenn der Unternehmer selbst die Gegenleistung des Verbrauchers finanziert, oder im Falle der Finanzierung durch einen Dritten, wenn sich der Darlehensgeber bei der Vorbereitung oder dem Abschluss des Darlehensvertrags der Mitwirkung des Unternehmers bedient. Bei einem finanzierten Erwerb eines Grundstücks oder eines grundstücksgleichen Rechts ist eine wirtschaftliche Einheit nur anzunehmen, wenn der Darlehensgeber selbst dem Verbraucher das Grundstück oder das grundstücksgleiche Recht verschafft oder wenn er über die Zurverfügungstellung von Darlehen hinaus den Erwerb des Grundstücks oder grundstücksgleichen Rechts durch Zusammenwirken mit dem Unternehmer fördert, indem er sich dessen Veräußerungsinteressen ganz oder teilweise zu Eigen macht, bei der Planung, Werbung oder Durchführung des Projekts Funktionen des Veräußerers übernimmt oder den Veräußerer einseitig begünstigt.(4) Auf die Rückabwicklung des verbundenen Vertrags sind unabhängig von der Vertriebsform § 355 Absatz 3 und, je nach Art des verbundenen Vertrags, die §§ 357 bis 357c entsprechend anzuwenden. Ist der verbundene Vertrag ein Vertrag über die Lieferung von nicht auf einem körperlichen Datenträger befindlichen digitalen Inhalten, hat der Verbraucher abweichend von § 357a Absatz 3 unter den Voraussetzungen des § 356 Absatz 5 Nummer 2 Wertersatz für die bis zum Widerruf gelieferten digitalen Inhalte zu leisten. Ist der verbundene Vertrag ein im Fernabsatz oder außerhalb von Geschäftsräumen geschlossener Ratenlieferungsvertrag, sind neben § 355 Absatz 3 auch die §§ 357 und 357a entsprechend anzuwenden; im Übrigen gelten für verbundene Ratenlieferungsverträge § 355 Absatz 3 und § 357d entsprechend. Im Falle des Absatzes 1 sind jedoch Ansprüche auf Zahlung von Zinsen und Kosten aus der Rückabwicklung des Darlehensvertrags gegen den Verbraucher ausgeschlossen. Der Darlehensgeber tritt im Verhältnis zum Verbraucher hinsichtlich der Rechtsfolgen des Widerrufs in die Rechte und Pflichten des Unternehmers aus dem verbundenen Vertrag ein, wenn das Darlehen dem Unternehmer bei Wirksamwerden des Widerrufs bereits zugeflossen ist.(5) Die Absätze 2 und 4 sind nicht anzuwenden auf Darlehensverträge, die der Finanzierung des Erwerbs von Finanzinstrumenten dienen.", "text_zh": "重点判断：这段可能被前后的矛盾影响。它自己不一定错，但可能是修复时必须看的相关段落。", "reading_hint_zh": "重点判断：这段可能被前后的矛盾影响。它自己不一定错，但可能是修复时必须看的相关段落。", "expert_hint_title_zh": "可能受影响段落", "expert_hint_reason_zh": "这段可能是受影响段落。 它不一定自己有错，但如果前后段落存在冲突，修复时可能需要一起看。", "expert_hint_level": "affected", "kind": "affected", "is_risk_endpoint": false, "is_bridge": false, "is_affected": true, "in_sa_core": false, "in_naive_subgraph": true, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.41538461538461535; visit_count=13; conflict_count=8; is_oc_detected=False", "display_id": "段落 11", "short_id": "bgb_358", "role_label_zh": "可能受影响段落"}, {"index": 12, "node_id": "bgb_360", "title": "§360 Zusammenhängende Verträge", "text_en": "§360 Zusammenhängende Verträge\n\n(1) Hat der Verbraucher seine auf den Abschluss eines Vertrags gerichtete Willenserklärung wirksam widerrufen und liegen die Voraussetzungen für einen verbundenen Vertrag nicht vor, so ist er auch an seine auf den Abschluss eines damit zusammenhängenden Vertrags gerichtete Willenserklärung nicht mehr gebunden. Auf die Rückabwicklung des zusammenhängenden Vertrags ist § 358 Absatz 4 Satz 1 bis 3 entsprechend anzuwenden. Widerruft der Verbraucher einen Teilzeit-Wohnrechtevertrag oder einen Vertrag über ein langfristiges Urlaubsprodukt, hat er auch für den zusammenhängenden Vertrag keine Kosten zu tragen; § 357c Absatz 1 Satz 2 und 3 gilt entsprechend.(2) Ein zusammenhängender Vertrag liegt vor, wenn er einen Bezug zu dem widerrufenen Vertrag aufweist und eine Leistung betrifft, die von dem Unternehmer des widerrufenen Vertrags oder einem Dritten auf der Grundlage einer Vereinbarung zwischen dem Dritten und dem Unternehmer des widerrufenen Vertrags erbracht wird. Ein Darlehensvertrag ist auch dann ein zusammenhängender Vertrag, wenn das Darlehen, das ein Unternehmer einem Verbraucher gewährt, ausschließlich der Finanzierung des widerrufenen Vertrags dient und die Leistung des Unternehmers aus dem widerrufenen Vertrag in dem Darlehensvertrag genau angegeben ist.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.30000000000000004; visit_count=8; conflict_count=4; is_oc_detected=False", "display_id": "段落 12", "short_id": "bgb_360", "role_label_zh": "context"}, {"index": 13, "node_id": "bgb_491", "title": "§491 Verbraucherdarlehensvertrag", "text_en": "§491 Verbraucherdarlehensvertrag (1) Die Vorschriften dieses Kapitels gelten für Verbraucherdarlehensverträge, soweit nichts anderes bestimmt ist. Verbraucherdarlehensverträge sind Allgemein-Verbraucherdarlehensverträge und Immobiliar-Verbraucherdarlehensverträge.(2) Allgemein-Verbraucherdarlehensverträge sind entgeltliche Darlehensverträge zwischen einem Unternehmer als Darlehensgeber und einem Verbraucher als Darlehensnehmer. Keine Allgemein-Verbraucherdarlehensverträge sind Verträge, 1.bei denen der Nettodarlehensbetrag (Artikel 247 § 3 Abs. 2 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche) weniger als 200 Euro beträgt,2.bei denen sich die Haftung des Darlehensnehmers auf eine dem Darlehensgeber zum Pfand übergebene Sache beschränkt,3.bei denen der Darlehensnehmer das Darlehen binnen drei Monaten zurückzuzahlen hat und nur geringe Kosten vereinbart sind,4.die von Arbeitgebern mit ihren Arbeitnehmern als Nebenleistung zum Arbeitsvertrag zu einem niedrigeren als dem marktüblichen effektiven Jahreszins (§ 16 der Preisangabenverordnung) abgeschlossen werden und anderen Personen nicht angeboten werden,5.die nur mit einem begrenzten Personenkreis auf Grund von Rechtsvorschriften in öffentlichem Interesse abgeschlossen werden, wenn im Vertrag für den Darlehensnehmer günstigere als marktübliche Bedingungen und höchstens der marktübliche Sollzinssatz vereinbart sind,6.bei denen es sich um Immobiliar-Verbraucherdarlehensverträge oder Immobilienverzehrkreditverträge gemäß Absatz 3 handelt.(3) Immobiliar-Verbraucherdarlehensverträge sind entgeltliche Darlehensverträge zwischen einem Unternehmer als Darlehensgeber und einem Verbraucher als Darlehensnehmer, die 1.durch ein Grundpfandrecht oder eine Reallast besichert sind oder2.für den Erwerb oder die Erhaltung des Eigentumsrechts an Grundstücken, an bestehenden oder zu errichtenden Gebäuden oder für den Erwerb oder die Erhaltung von grundstücksgleichen Rechten bestimmt sind.Keine Immobiliar-Verbraucherdarlehensverträge sind Verträge gemäß Absatz 2 Satz 2 Nummer 4. Auf Immobiliar-Verbraucherdarlehensverträge gemäß Absatz 2 Satz 2 Nummer 5 ist nur § 491a Absatz 4 anwendbar. Keine Immobiliar-Verbraucherdarlehensverträge sind Immobilienverzehrkreditverträge, bei denen der Kreditgeber 1.pauschale oder regelmäßige Zahlungen leistet oder andere Formen der Kreditauszahlung vornimmt und im Gegenzug nur einen Betrag aus dem künftigen Erlös des Verkaufs einer Wohnimmobilie erhält oder ein Recht an einer Wohnimmobilie erwirbt und2.erst nach dem Tod des Verbrauchers eine Rückzahlung fordert, außer der Verbraucher verstößt gegen die Vertragsbestimmungen, was dem Kreditgeber erlaubt, den Vertrag zu kündigen.(4) § 358 Abs. 2 und 4 sowie die §§ 491a bis 495 und 505a bis 505e sind nicht auf Darlehensverträge anzuwenden, die in ein nach den Vorschriften der Zivilprozessordnung errichtetes gerichtliches Protokoll aufgenommen oder durch einen gerichtlichen Beschluss über das Zustandekommen und den Inhalt eines zwischen den Parteien geschlossenen Vergleichs festgestellt sind, wenn in das Protokoll oder den Beschluss der Sollzinssatz, die bei Abschluss des Vertrags in Rechnung gestellten Kosten des Darlehens sowie die Voraussetzungen aufgenommen worden sind, unter denen der Sollzinssatz oder die Kosten angepasst werden können. The downstream remedy is applied as if the three-month deadline had already expired on the same path. This record applies the opposite remedy class immediately on the same obligation path, creating a non-curable enforcement conflict if the upstream classification is still in force.", "text_zh": "重点判断：这段可能是矛盾的一端。它单独看未必错，但和远处另一段放在一起可能无法同时成立。", "reading_hint_zh": "重点判断：这段可能是矛盾的一端。它单独看未必错，但和远处另一段放在一起可能无法同时成立。", "expert_hint_title_zh": "高风险重点段落", "expert_hint_reason_zh": "这段是高风险重点段落。 它包含的要求可能和另一段文字不能同时成立，建议专家直接核对。 风险证据：The downstream remedy is applied as if the three-month deadline had already expired on the same path. This record applies the opposite remedy class immediately on the same obligation path, creating a non-curable enforcement conflict if the upstream classification is still in force. 这段在多次小范围检查中被反复注意到。", "expert_hint_level": "risk", "kind": "risk", "is_risk_endpoint": true, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": true, "in_oc": true, "in_context": false, "injected_note": "The downstream remedy is applied as if the three-month deadline had already expired on the same path. This record applies the opposite remedy class immediately on the same obligation path, creating a non-curable enforcement conflict if the upstream classification is still in force.", "stats": "mean_score=0.4461538461538461; visit_count=13; conflict_count=8; is_oc_detected=True", "display_id": "段落 13", "short_id": "bgb_491", "role_label_zh": "risk"}, {"index": 14, "node_id": "bgb_491a", "title": "§491a Vorvertragliche Informationspflichten bei Verbraucherdarlehensverträgen", "text_en": "§491a Vorvertragliche Informationspflichten bei Verbraucherdarlehensverträgen\n\n(1) Der Darlehensgeber ist verpflichtet, den Darlehensnehmer nach Maßgabe des Artikels 247 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche zu informieren.(2) Der Darlehensnehmer kann vom Darlehensgeber einen Entwurf des Verbraucherdarlehensvertrags verlangen. Dies gilt nicht, solange der Darlehensgeber zum Vertragsabschluss nicht bereit ist. Unterbreitet der Darlehensgeber bei einem Immobiliar-Verbraucherdarlehensvertrag dem Darlehensnehmer ein Angebot oder einen bindenden Vorschlag für bestimmte Vertragsbestimmungen, so muss er dem Darlehensnehmer anbieten, einen Vertragsentwurf auszuhändigen oder zu übermitteln; besteht kein Widerrufsrecht nach § 495, ist der Darlehensgeber dazu verpflichtet, dem Darlehensnehmer einen Vertragsentwurf auszuhändigen oder zu übermitteln.(3) Der Darlehensgeber ist verpflichtet, dem Darlehensnehmer vor Abschluss eines Verbraucherdarlehensvertrags angemessene Erläuterungen zu geben, damit der Darlehensnehmer in die Lage versetzt wird, zu beurteilen, ob der Vertrag dem von ihm verfolgten Zweck und seinen Vermögensverhältnissen gerecht wird. Hierzu sind gegebenenfalls die vorvertraglichen Informationen gemäß Absatz 1, die Hauptmerkmale der vom Darlehensgeber angebotenen Verträge sowie ihre vertragstypischen Auswirkungen auf den Darlehensnehmer, einschließlich der Folgen bei Zahlungsverzug, zu erläutern. Werden mit einem Immobiliar-Verbraucherdarlehensvertrag Finanzprodukte oder -dienstleistungen im Paket angeboten, so muss dem Darlehensnehmer erläutert werden, ob sie gesondert gekündigt werden können und welche Folgen die Kündigung hat.(4) Bei einem Immobiliar-Verbraucherdarlehensvertrag entsprechend § 491 Absatz 2 Satz 2 Nummer 5 ist der Darlehensgeber verpflichtet, den Darlehensnehmer rechtzeitig vor Abgabe von dessen Vertragserklärung auf einem dauerhaften Datenträger über die Merkmale gemäß den Abschnitten 3, 4 und 13 des in Artikel 247 § 1 Absatz 2 Satz 2 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche genannten Musters zu informieren. Artikel 247 § 1 Absatz 2 Satz 6 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche findet Anwendung.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.3428571428571428; visit_count=14; conflict_count=19; is_oc_detected=False", "display_id": "段落 14", "short_id": "bgb_491a", "role_label_zh": "suggested"}, {"index": 15, "node_id": "bgb_493", "title": "§493 Informationen während des Vertragsverhältnisses", "text_en": "§493 Informationen während des Vertragsverhältnisses\n\n(1) Ist in einem Verbraucherdarlehensvertrag der Sollzinssatz gebunden und endet die Sollzinsbindung vor der für die Rückzahlung bestimmten Zeit, unterrichtet der Darlehensgeber den Darlehensnehmer spätestens drei Monate vor Ende der Sollzinsbindung darüber, ob er zu einer neuen Sollzinsbindungsabrede bereit ist. Erklärt sich der Darlehensgeber hierzu bereit, muss die Unterrichtung den zum Zeitpunkt der Unterrichtung vom Darlehensgeber angebotenen Sollzinssatz enthalten.(2) Der Darlehensgeber unterrichtet den Darlehensnehmer spätestens drei Monate vor Beendigung eines Verbraucherdarlehensvertrags darüber, ob er zur Fortführung des Darlehensverhältnisses bereit ist. Erklärt sich der Darlehensgeber zur Fortführung bereit, muss die Unterrichtung die zum Zeitpunkt der Unterrichtung gültigen Pflichtangaben gemäß § 491a Abs. 1 enthalten.(3) Die Anpassung des Sollzinssatzes eines Verbraucherdarlehensvertrags mit veränderlichem Sollzinssatz wird erst wirksam, nachdem der Darlehensgeber den Darlehensnehmer über die Einzelheiten unterrichtet hat, die sich aus Artikel 247 § 15 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche ergeben. Abweichende Vereinbarungen über die Wirksamkeit sind im Rahmen des Artikels 247 § 15 Absatz 2 und 3 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche zulässig.(4) Bei einem Vertrag über ein Immobiliar-Verbraucherdarlehen in Fremdwährung gemäß § 503 Absatz 1 Satz 1, auch in Verbindung mit Satz 3, hat der Darlehensgeber den Darlehensnehmer unverzüglich zu informieren, wenn der Wert des noch zu zahlenden Restbetrags oder der Wert der regelmäßigen Raten in der Landeswährung des Darlehensnehmers um mehr als 20 Prozent gegenüber dem Wert steigt, der bei Zugrundelegung des Wechselkurses bei Vertragsabschluss gegeben wäre. Die Information 1.ist auf einem dauerhaften Datenträger zu übermitteln,2.hat die Angabe über die Veränderung des Restbetrags in der Landeswährung des Darlehensnehmers zu enthalten,3.hat den Hinweis auf die Möglichkeit einer Währungsumstellung aufgrund des § 503 und die hierfür geltenden Bedingungen und gegebenenfalls die Erläuterung weiterer Möglichkeiten zur Begrenzung des Wechselkursrisikos zu enthalten und4.ist so lange in regelmäßigen Abständen zu erteilen, bis die Differenz von 20 Prozent wieder unterschritten wird.Die Sätze 1 und 2 sind entsprechend anzuwenden, wenn ein Immobiliar-Verbraucherdarlehensvertrag in der Währung des Mitgliedstaats der Europäischen Union, in dem der Darlehensnehmer bei Vertragsschluss seinen Wohnsitz hat, geschlossen wurde und der Darlehensnehmer zum Zeitpunkt der maßgeblichen Kreditwürdigkeitsprüfung in einer anderen Währung überwiegend sein Einkommen bezieht oder Vermögenswerte hält, aus denen das Darlehen zurückgezahlt werden soll.(5) Wenn der Darlehensnehmer eines Immobiliar-Verbraucherdarlehensvertrags dem Darlehensgeber mitteilt, dass er eine vorzeitige Rückzahlung des Darlehens beabsichtigt, ist der Darlehensgeber verpflichtet, ihm unverzüglich die für die Prüfung dieser Möglichkeit erforderlichen Informationen auf einem dauerhaften Datenträger zu übermitteln. Diese Informationen müssen insbesondere folgende Angaben enthalten: 1.Auskunft über die Zulässigkeit der vorzeitigen Rückzahlung,2.im Fall der Zulässigkeit die Höhe des zurückzuzahlenden Betrags und3.gegebenenfalls die Höhe einer Vorfälligkeitsentschädigung.Soweit sich die Informationen auf Annahmen stützen, müssen diese nachvollziehbar und sachlich gerechtfertigt sein und als solche dem Darlehensnehmer gegenüber offengelegt werden.(6) Wurden Forderungen aus dem Darlehensvertrag abgetreten, treffen die Pflichten aus den Absätzen 1 bis 5 auch den neuen Gläubiger, wenn nicht der bisherige Darlehensgeber mit dem neuen Gläubiger vereinbart hat, dass im Verhältnis zum Darlehensnehmer weiterhin allein der bisherige Darlehensgeber auftritt.(7) Der Darlehensgeber übermittelt dem Darlehensnehmer vor der Änderung der Bestimmungen des Verbraucherdarlehensvertrags die folgenden Informationen: 1.eine klare Beschreibung a)der vorgeschlagenen Änderungen,b)soweit zutreffend, der Notwendigkeit der Zustimmung des Darlehensnehmers zu den Änderungen nach Buchstabe a undc)soweit zutreffend, der gesetzlich eingeführten Änderungen, die den Änderungen nach Buchstabe a zugrunde liegen,2.den zeitlichen Rahmen, der für die Umsetzung der Änderungen nach Nummer 1 Buchstabe a vorgesehen ist, und3.die Möglichkeiten, die dem Darlehensnehmer zur Verfügung stehen, um gegen die Änderungen nach Nummer 1 Buchstabe a Beschwerde einzulegen, die Frist für die Einlegung der Beschwerde sowie die Bezeichnung und Anschrift der zuständigen Behörde, bei der die Beschwerde eingereicht werden kann.§ 492 Absatz 5 ist nicht anzuwenden.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.28; visit_count=5; conflict_count=0; is_oc_detected=False", "display_id": "段落 15", "short_id": "bgb_493", "role_label_zh": "context"}, {"index": 16, "node_id": "bgb_495", "title": "§495 Widerrufsrecht; Bedenkzeit", "text_en": "§495 Widerrufsrecht; Bedenkzeit\n\n(1) Dem Darlehensnehmer steht bei einem Verbraucherdarlehensvertrag ein Widerrufsrecht nach § 355 zu.(2) Ein Widerrufsrecht besteht nicht bei Darlehensverträgen, 1.die einen Darlehensvertrag, zu dessen Kündigung der Darlehensgeber wegen Zahlungsverzugs des Darlehensnehmers berechtigt ist, durch Rückzahlungsvereinbarungen ergänzen oder ersetzen, wenn dadurch ein gerichtliches Verfahren vermieden wird und wenn der Gesamtbetrag (Artikel 247 § 3 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche) geringer ist als die Restschuld des ursprünglichen Vertrags,2.die notariell zu beurkunden sind, wenn der Notar bestätigt, dass die Rechte des Darlehensnehmers aus den §§ 491a und 492 gewahrt sind, oder3.die § 504 Abs. 2 oder § 505 entsprechen.(3) Bei Immobiliar-Verbraucherdarlehensverträgen ist dem Darlehensnehmer in den Fällen des Absatzes 2 vor Vertragsschluss eine Bedenkzeit von zumindest sieben Tagen einzuräumen. Während des Laufs der Frist ist der Darlehensgeber an sein Angebot gebunden. Die Bedenkzeit beginnt mit der Aushändigung des Vertragsangebots an den Darlehensnehmer.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.3916666666666666; visit_count=12; conflict_count=10; is_oc_detected=False", "display_id": "段落 16", "short_id": "bgb_495", "role_label_zh": "suggested"}, {"index": 17, "node_id": "bgb_505", "title": "§505 Geduldete Überziehung", "text_en": "§505 Geduldete Überziehung (1) Vereinbart ein Unternehmer in einem Vertrag mit einem Verbraucher über ein laufendes Konto ohne eingeräumte Überziehungsmöglichkeit ein Entgelt für den Fall, dass er eine Überziehung des Kontos duldet, müssen in diesem Vertrag die Angaben nach Artikel 247 § 17 Abs. 1 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche auf einem dauerhaften Datenträger enthalten sein und dem Verbraucher in regelmäßigen Zeitabständen auf einem dauerhaften Datenträger mitgeteilt werden. Satz 1 gilt entsprechend, wenn ein Darlehensgeber mit einem Darlehensnehmer in einem Vertrag über ein laufendes Konto mit eingeräumter Überziehungsmöglichkeit ein Entgelt für den Fall vereinbart, dass er eine Überziehung des Kontos über die vertraglich bestimmte Höhe hinaus duldet.(2) Kommt es im Fall des Absatzes 1 zu einer erheblichen Überziehung von mehr als einem Monat, unterrichtet der Darlehensgeber den Darlehensnehmer unverzüglich auf einem dauerhaften Datenträger über die sich aus Artikel 247 § 17 Abs. 2 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche ergebenden Einzelheiten. Wenn es im Fall des Absatzes 1 zu einer ununterbrochenen Überziehung von mehr als drei Monaten gekommen ist und der durchschnittliche Überziehungsbetrag die Hälfte des durchschnittlichen monatlichen Geldeingangs innerhalb der letzten drei Monate auf diesem Konto übersteigt, so gilt § 504a entsprechend. Wenn der Rechnungsabschluss für das laufende Konto vierteljährlich erfolgt, ist der maßgebliche Zeitpunkt für das Vorliegen der Voraussetzungen nach Satz 1 der jeweilige Rechnungsabschluss.(3) Verstößt der Unternehmer gegen Absatz 1 oder Absatz 2, kann der Darlehensgeber über die Rückzahlung des Darlehens hinaus Kosten und Zinsen nicht verlangen.(4) Die §§ 491a bis 496 und 499 bis 502 sind auf Allgemein-Verbraucherdarlehensverträge, die unter den in Absatz 1 genannten Voraussetzungen zustande kommen, nicht anzuwenden. The grace period remains open until the three-month deadline expires. Before that date, the obligation is handled as timely cured. This classification is mandatory for the same obligation path. A contrary downstream treatment would make the same debtor both released from the burden and immediately in default, with no residual discretion to reconcile the two remedies.", "text_zh": "重点判断：这段可能是矛盾的一端。它单独看未必错，但和远处另一段放在一起可能无法同时成立。", "reading_hint_zh": "重点判断：这段可能是矛盾的一端。它单独看未必错，但和远处另一段放在一起可能无法同时成立。", "expert_hint_title_zh": "高风险重点段落", "expert_hint_reason_zh": "这段是高风险重点段落。 它包含的要求可能和另一段文字不能同时成立，建议专家直接核对。 风险证据：The grace period remains open until the three-month deadline expires. Before that date, the obligation is handled as timely cured. This classification is mandatory for the same obligation path. A contrary downstream treatment would make the same debtor both released from the burden and immediately in default, with no residual discretion to reconcile the two remedies. 系统也把它列为优先审阅段落。 这段在多次小范围检查中被反复注意到。", "expert_hint_level": "risk", "kind": "risk", "is_risk_endpoint": true, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": true, "in_context": true, "injected_note": "The grace period remains open until the three-month deadline expires. Before that date, the obligation is handled as timely cured. This classification is mandatory for the same obligation path. A contrary downstream treatment would make the same debtor both released from the burden and immediately in default, with no residual discretion to reconcile the two remedies.", "stats": "mean_score=0.5999999999999999; visit_count=7; conflict_count=9; is_oc_detected=True", "display_id": "段落 17", "short_id": "bgb_505", "role_label_zh": "risk"}, {"index": 18, "node_id": "bgb_504", "title": "§504 Eingeräumte Überziehungsmöglichkeit", "text_en": "§504 Eingeräumte Überziehungsmöglichkeit\n\n(1) Ist ein Verbraucherdarlehen in der Weise gewährt, dass der Darlehensgeber in einem Vertragsverhältnis über ein laufendes Konto dem Darlehensnehmer das Recht einräumt, sein Konto in bestimmter Höhe zu überziehen (Überziehungsmöglichkeit), hat der Darlehensgeber den Darlehensnehmer in regelmäßigen Zeitabständen über die Angaben zu unterrichten, die sich aus Artikel 247 § 16 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche ergeben. Ein Anspruch auf Vorfälligkeitsentschädigung aus § 502 ist ausgeschlossen. § 493 Abs. 3 ist nur bei einer Erhöhung des Sollzinssatzes anzuwenden und gilt entsprechend bei einer Erhöhung der vereinbarten sonstigen Kosten. § 499 Abs. 1 ist nicht anzuwenden.(2) Ist in einer Überziehungsmöglichkeit in Form des Allgemein-Verbraucherdarlehensvertrags vereinbart, dass nach der Auszahlung die Laufzeit höchstens drei Monate beträgt oder der Darlehensgeber kündigen kann, ohne eine Frist einzuhalten, sind § 491a Abs. 3, § 493 Absatz 7, die §§ 495, 499 Abs. 2 und § 500 Abs. 1 Satz 2 nicht anzuwenden. § 492 Abs. 1 ist nicht anzuwenden, wenn außer den Sollzinsen keine weiteren laufenden Kosten vereinbart sind, die Sollzinsen nicht in kürzeren Zeiträumen als drei Monaten fällig werden und der Darlehensgeber dem Darlehensnehmer den Vertragsinhalt spätestens unverzüglich nach Vertragsabschluss auf einem dauerhaften Datenträger mitteilt.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 这段在多次小范围检查中被反复注意到，所以建议先看；最终判断仍以你的标注为准。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": true, "in_context": true, "injected_note": "", "stats": "mean_score=0.4727272727272727; visit_count=11; conflict_count=10; is_oc_detected=True", "display_id": "段落 18", "short_id": "bgb_504", "role_label_zh": "suggested"}, {"index": 19, "node_id": "bgb_506", "title": "§506 Zahlungsaufschub, sonstige Finanzierungshilfe", "text_en": "§506 Zahlungsaufschub, sonstige Finanzierungshilfe\n\n(1) Die für Allgemein-Verbraucherdarlehensverträge geltenden Vorschriften der §§ 358 bis 360 und 491a bis 502 sowie 505a bis 505e sind mit Ausnahme des § 492 Abs. 4 und vorbehaltlich der Absätze 3 und 4 auf Verträge entsprechend anzuwenden, durch die ein Unternehmer einem Verbraucher einen entgeltlichen Zahlungsaufschub oder eine sonstige entgeltliche Finanzierungshilfe gewährt. Bezieht sich der entgeltliche Zahlungsaufschub oder die sonstige entgeltliche Finanzierungshilfe auf den Erwerb oder die Erhaltung des Eigentumsrechts an Grundstücken, an bestehenden oder zu errichtenden Gebäuden oder auf den Erwerb oder die Erhaltung von grundstücksgleichen Rechten oder ist der Anspruch des Unternehmers durch ein Grundpfandrecht oder eine Reallast besichert, so sind die für Immobiliar-Verbraucherdarlehensverträge geltenden, in Satz 1 genannten Vorschriften sowie § 503 entsprechend anwendbar. Ein unentgeltlicher Zahlungsaufschub gilt als entgeltlicher Zahlungsaufschub gemäß Satz 2, wenn er davon abhängig gemacht wird, dass die Forderung durch ein Grundpfandrecht oder eine Reallast besichert wird.(2) Verträge zwischen einem Unternehmer und einem Verbraucher über die entgeltliche Nutzung eines Gegenstandes gelten als entgeltliche Finanzierungshilfe, wenn vereinbart ist, dass 1.der Verbraucher zum Erwerb des Gegenstandes verpflichtet ist,2.der Unternehmer vom Verbraucher den Erwerb des Gegenstandes verlangen kann oder3.der Verbraucher bei Beendigung des Vertrags für einen bestimmten Wert des Gegenstandes einzustehen hat.Auf Verträge gemäß Satz 1 Nummer 3 sind § 500 Absatz 2, § 501 Absatz 1 und § 502 nicht anzuwenden.(3) Für Verträge, die die Lieferung einer bestimmten Sache oder die Erbringung einer bestimmten anderen Leistung gegen Teilzahlungen zum Gegenstand haben (Teilzahlungsgeschäfte), gelten vorbehaltlich des Absatzes 4 zusätzlich die in den §§ 507 und 508 geregelten Besonderheiten.(4) Die Vorschriften dieses Untertitels sind in dem in § 491 Absatz 2 Satz 2 Nummer 1 bis 5, Absatz 3 Satz 2 und Absatz 4 bestimmten Umfang nicht anzuwenden. Soweit nach der Vertragsart ein Nettodarlehensbetrag (§ 491 Absatz 2 Satz 2 Nummer 1) nicht vorhanden ist, tritt an seine Stelle der Barzahlungspreis oder, wenn der Unternehmer den Gegenstand für den Verbraucher erworben hat, der Anschaffungspreis.", "text_zh": "重点判断：这段可能被前后的矛盾影响。它自己不一定错，但可能是修复时必须看的相关段落。", "reading_hint_zh": "重点判断：这段可能被前后的矛盾影响。它自己不一定错，但可能是修复时必须看的相关段落。", "expert_hint_title_zh": "可能受影响段落", "expert_hint_reason_zh": "这段可能是受影响段落。 它不一定自己有错，但如果前后段落存在冲突，修复时可能需要一起看。 系统把它放进了建议优先看的材料中。", "expert_hint_level": "affected", "kind": "affected", "is_risk_endpoint": false, "is_bridge": false, "is_affected": true, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.4769230769230769; visit_count=13; conflict_count=12; is_oc_detected=False", "display_id": "段落 19", "short_id": "bgb_506", "role_label_zh": "可能受影响段落"}, {"index": 20, "node_id": "bgb_507", "title": "§507 Teilzahlungsgeschäfte", "text_en": "§507 Teilzahlungsgeschäfte\n\n(1) § 494 Abs. 1 bis 3 und 6 Satz 2 zweiter Halbsatz ist auf Teilzahlungsgeschäfte nicht anzuwenden. Gibt der Verbraucher sein Angebot zum Vertragsabschluss im Fernabsatz auf Grund eines Verkaufsprospekts oder eines vergleichbaren elektronischen Mediums ab, aus dem der Barzahlungspreis, der Sollzinssatz, der effektive Jahreszins, ein Tilgungsplan anhand beispielhafter Gesamtbeträge sowie die zu stellenden Sicherheiten und Versicherungen ersichtlich sind, ist auch § 492 Abs. 1 nicht anzuwenden, wenn der Unternehmer dem Verbraucher den Vertragsinhalt spätestens unverzüglich nach Vertragsabschluss auf einem dauerhaften Datenträger mitteilt.(2) Das Teilzahlungsgeschäft ist nichtig, wenn die vorgeschriebene Schriftform des § 492 Abs. 1 nicht eingehalten ist oder im Vertrag eine der in Artikel 247 §§ 6, 12 und 13 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche vorgeschriebenen Angaben fehlt. Ungeachtet eines Mangels nach Satz 1 wird das Teilzahlungsgeschäft gültig, wenn dem Verbraucher die Sache übergeben oder die Leistung erbracht wird. Jedoch ist der Barzahlungspreis höchstens mit dem gesetzlichen Zinssatz zu verzinsen, wenn die Angabe des Gesamtbetrags oder des effektiven Jahreszinses fehlt. Ist ein Barzahlungspreis nicht genannt, so gilt im Zweifel der Marktpreis als Barzahlungspreis. Ist der effektive Jahreszins zu niedrig angegeben, so vermindert sich der Gesamtbetrag um den Prozentsatz, um den der effektive Jahreszins zu niedrig angegeben ist.(3) Abweichend von den §§ 491a und 492 Abs. 2 dieses Gesetzes und von Artikel 247 §§ 3, 6 und 12 des Einführungsgesetzes zum Bürgerlichen Gesetzbuche müssen in der vorvertraglichen Information und im Vertrag der Barzahlungspreis und der effektive Jahreszins nicht angegeben werden, wenn der Unternehmer nur gegen Teilzahlungen Sachen liefert oder Leistungen erbringt. Im Fall des § 501 ist der Berechnung der Kostenermäßigung der gesetzliche Zinssatz (§ 246) zugrunde zu legen. Ein Anspruch auf Vorfälligkeitsentschädigung ist ausgeschlossen.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 这段在多次小范围检查中被反复注意到，所以建议先看；最终判断仍以你的标注为准。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": false, "in_oc": true, "in_context": true, "injected_note": "", "stats": "mean_score=0.52; visit_count=10; conflict_count=9; is_oc_detected=True", "display_id": "段落 20", "short_id": "bgb_507", "role_label_zh": "suggested"}, {"index": 21, "node_id": "bgb_508", "title": "§508 Rücktritt bei Teilzahlungsgeschäften", "text_en": "§508 Rücktritt bei Teilzahlungsgeschäften\n\nDer Unternehmer kann von einem Teilzahlungsgeschäft wegen Zahlungsverzugs des Verbrauchers nur unter den in § 498 Absatz 1 Satz 1 bezeichneten Voraussetzungen zurücktreten. Dem Nennbetrag entspricht der Gesamtbetrag. Der Verbraucher hat dem Unternehmer auch die infolge des Vertrags gemachten Aufwendungen zu ersetzen. Bei der Bemessung der Vergütung von Nutzungen einer zurückzugewährenden Sache ist auf die inzwischen eingetretene Wertminderung Rücksicht zu nehmen. Nimmt der Unternehmer die auf Grund des Teilzahlungsgeschäfts gelieferte Sache wieder an sich, gilt dies als Ausübung des Rücktrittsrechts, es sei denn, der Unternehmer einigt sich mit dem Verbraucher, diesem den gewöhnlichen Verkaufswert der Sache im Zeitpunkt der Wegnahme zu vergüten. Satz 5 gilt entsprechend, wenn ein Vertrag über die Lieferung einer Sache mit einem Verbraucherdarlehensvertrag verbunden ist (§ 358 Absatz 3) und wenn der Darlehensgeber die Sache an sich nimmt; im Fall des Rücktritts bestimmt sich das Rechtsverhältnis zwischen dem Darlehensgeber und dem Verbraucher nach den Sätzen 3 und 4.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.31999999999999995; visit_count=5; conflict_count=1; is_oc_detected=False", "display_id": "段落 21", "short_id": "bgb_508", "role_label_zh": "context"}, {"index": 22, "node_id": "bgb_512", "title": "§512 Abweichende Vereinbarungen", "text_en": "§512 Abweichende Vereinbarungen\n\nVon den Vorschriften der §§ 491 bis 511, 514 und 515 darf, soweit nicht ein anderes bestimmt ist, nicht zum Nachteil des Verbrauchers abgewichen werden. Diese Vorschriften finden auch Anwendung, wenn sie durch anderweitige Gestaltungen umgangen werden.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.3; visit_count=6; conflict_count=2; is_oc_detected=False", "display_id": "段落 22", "short_id": "bgb_512", "role_label_zh": "context"}, {"index": 23, "node_id": "bgb_513", "title": "§513 Anwendung auf Existenzgründer", "text_en": "§513 Anwendung auf Existenzgründer\n\nDie §§ 491 bis 512 gelten auch für natürliche Personen, die sich ein Darlehen, einen Zahlungsaufschub oder eine sonstige Finanzierungshilfe für die Aufnahme einer gewerblichen oder selbständigen beruflichen Tätigkeit gewähren lassen oder zu diesem Zweck einen Ratenlieferungsvertrag schließen, es sei denn, der Nettodarlehensbetrag oder Barzahlungspreis übersteigt 75 000 Euro oder die Verordnung (EU) 2020/1503 des Europäischen Parlaments und des Rates vom 7. Oktober 2020 über Europäische Schwarmfinanzierungsdienstleister für Unternehmen und zur Änderung der Verordnung (EU) 2017/1129 und der Richtlinie (EU) 2019/1937 (ABl. L 347 vom 20.10.2020, S. 1) ist anwendbar.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": false, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.27999999999999997; visit_count=5; conflict_count=5; is_oc_detected=False", "display_id": "段落 23", "short_id": "bgb_513", "role_label_zh": "suggested"}, {"index": 24, "node_id": "bgb_514", "title": "§514 Unentgeltliche Darlehensverträge", "text_en": "§514 Unentgeltliche Darlehensverträge (1) § 497 Absatz 1 und 3 sowie § 498 und die §§ 505a bis 505c sowie 505d Absatz 2 und 3 sowie § 505e sind entsprechend auf Verträge anzuwenden, durch die ein Unternehmer einem Verbraucher ein unentgeltliches Darlehen gewährt. Dies gilt nicht in dem in § 491 Absatz 2 Satz 2 Nummer 1 bestimmten Umfang.(2) Bei unentgeltlichen Darlehensverträgen gemäß Absatz 1 steht dem Verbraucher ein Widerrufsrecht nach § 355 zu. Dies gilt nicht, wenn bereits ein Wide
