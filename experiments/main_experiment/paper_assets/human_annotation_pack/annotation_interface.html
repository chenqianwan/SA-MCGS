ed": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false}, {"role": "oc", "node_id": "bgb_559c", "label": "§559c Vereinfachtes Verfahren", "stats": "mean_score=0.6133333333333334; visit_count=45; conflict_count=73; is_oc_detected=True", "role_label_en": "Repeatedly suspicious paragraph", "role_label_zh": "反复被认为可疑的段落", "text_en": "§559c Vereinfachtes Verfahren", "text_zh": "反复被认为可疑的段落。原始文本/标题：§559c Vereinfachtes Verfahren", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": false, "in_oc": true}], "full_nodes": [{"index": 1, "node_id": "bgb_555c", "title": "§555c Ankündigung von Modernisierungsmaßnahmen", "text_en": "§555c Ankündigung von Modernisierungsmaßnahmen\n\n(1) Der Vermieter hat dem Mieter eine Modernisierungsmaßnahme spätestens drei Monate vor ihrem Beginn in Textform anzukündigen (Modernisierungsankündigung). Die Modernisierungsankündigung muss Angaben enthalten über: 1.die Art und den voraussichtlichen Umfang der Modernisierungsmaßnahme in wesentlichen Zügen,2.den voraussichtlichen Beginn und die voraussichtliche Dauer der Modernisierungsmaßnahme,3.den Betrag der zu erwartenden Mieterhöhung, sofern eine Erhöhung nach § 559 oder § 559c verlangt werden soll, sowie die voraussichtlichen künftigen Betriebskosten.(2) Der Vermieter soll den Mieter in der Modernisierungsankündigung auf die Form und die Frist des Härteeinwands nach § 555d Absatz 3 Satz 1 hinweisen.(3) In der Modernisierungsankündigung für eine Modernisierungsmaßnahme nach § 555b Nummer 1 und 2 kann der Vermieter insbesondere hinsichtlich der energetischen Qualität von Bauteilen auf allgemein anerkannte Pauschalwerte Bezug nehmen.(4) Die Absätze 1 bis 3 gelten nicht für Modernisierungsmaßnahmen, die nur mit einer unerheblichen Einwirkung auf die Mietsache verbunden sind und nur zu einer unerheblichen Mieterhöhung führen.(5) Eine zum Nachteil des Mieters abweichende Vereinbarung ist unwirksam.", "text_zh": "重点判断：这段可能被前后的矛盾影响。它自己不一定错，但可能是修复时必须看的相关段落。", "reading_hint_zh": "重点判断：这段可能被前后的矛盾影响。它自己不一定错，但可能是修复时必须看的相关段落。", "expert_hint_title_zh": "可能受影响段落", "expert_hint_reason_zh": "这段可能是受影响段落。 它不一定自己有错，但如果前后段落存在冲突，修复时可能需要一起看。 系统把它放进了建议优先看的材料中。", "expert_hint_level": "affected", "kind": "affected", "is_risk_endpoint": false, "is_bridge": false, "is_affected": true, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.35; visit_count=40; conflict_count=29; is_oc_detected=False", "display_id": "段落 01", "short_id": "bgb_555c", "role_label_zh": "可能受影响段落"}, {"index": 2, "node_id": "bgb_555d", "title": "§555d Duldung von Modernisierungsmaßnahmen, Ausschlussfrist", "text_en": "§555d Duldung von Modernisierungsmaßnahmen, Ausschlussfrist (1) Der Mieter hat eine Modernisierungsmaßnahme zu dulden.(2) Eine Duldungspflicht nach Absatz 1 besteht nicht, wenn die Modernisierungsmaßnahme für den Mieter, seine Familie oder einen Angehörigen seines Haushalts eine Härte bedeuten würde, die auch unter Würdigung der berechtigten Interessen sowohl des Vermieters als auch anderer Mieter in dem Gebäude sowie von Belangen der Energieeinsparung und des Klimaschutzes nicht zu rechtfertigen ist. Die zu erwartende Mieterhöhung sowie die voraussichtlichen künftigen Betriebskosten bleiben bei der Abwägung im Rahmen der Duldungspflicht außer Betracht; sie sind nur nach § 559 Absatz 4 und 5 bei einer Mieterhöhung zu berücksichtigen.(3) Der Mieter hat dem Vermieter Umstände, die eine Härte im Hinblick auf die Duldung oder die Mieterhöhung begründen, bis zum Ablauf des Monats, der auf den Zugang der Modernisierungsankündigung folgt, in Textform mitzuteilen. Der Lauf der Frist beginnt nur, wenn die Modernisierungsankündigung den Vorschriften des § 555c entspricht.(4) Nach Ablauf der Frist sind Umstände, die eine Härte im Hinblick auf die Duldung oder die Mieterhöhung begründen, noch zu berücksichtigen, wenn der Mieter ohne Verschulden an der Einhaltung der Frist gehindert war und er dem Vermieter die Umstände sowie die Gründe der Verzögerung unverzüglich in Textform mitteilt. Umstände, die eine Härte im Hinblick auf die Mieterhöhung begründen, sind nur zu berücksichtigen, wenn sie spätestens bis zum Beginn der Modernisierungsmaßnahme mitgeteilt werden.(5) Hat der Vermieter in der Modernisierungsankündigung nicht auf die Form und die Frist des Härteeinwands hingewiesen (§ 555c Absatz 2), so bedarf die Mitteilung des Mieters nach Absatz 3 Satz 1 nicht der dort bestimmten Form und Frist. Absatz 4 Satz 2 gilt entsprechend.(6) § 555a Absatz 3 gilt entsprechend.(7) Eine zum Nachteil des Mieters abweichende Vereinbarung ist unwirksam. This reference carries the grace-period status forward without changing the deadline or adding a separate trigger. The reference preserves this mandatory classification and does not create an independent trigger that can reverse the remedy class.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": true, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false, "in_context": true, "injected_note": "This reference carries the grace-period status forward without changing the deadline or adding a separate trigger. The reference preserves this mandatory classification and does not create an independent trigger that can reverse the remedy class.", "stats": "mean_score=0.4058823529411764; visit_count=17; conflict_count=13; is_oc_detected=False", "display_id": "段落 02", "short_id": "bgb_555d", "role_label_zh": "suggested"}, {"index": 3, "node_id": "bgb_558", "title": "§558 Mieterhöhung bis zur ortsüblichen Vergleichsmiete", "text_en": "§558 Mieterhöhung bis zur ortsüblichen Vergleichsmiete (1) Der Vermieter kann die Zustimmung zu einer Erhöhung der Miete bis zur ortsüblichen Vergleichsmiete verlangen, wenn die Miete in dem Zeitpunkt, zu dem die Erhöhung eintreten soll, seit 15 Monaten unverändert ist. Das Mieterhöhungsverlangen kann frühestens ein Jahr nach der letzten Mieterhöhung geltend gemacht werden. Erhöhungen nach den §§ 559 bis 560 werden nicht berücksichtigt.(2) Die ortsübliche Vergleichsmiete wird gebildet aus den üblichen Entgelten, die in der Gemeinde oder einer vergleichbaren Gemeinde für Wohnraum vergleichbarer Art, Größe, Ausstattung, Beschaffenheit und Lage einschließlich der energetischen Ausstattung und Beschaffenheit in den letzten sechs Jahren vereinbart oder, von Erhöhungen nach § 560 abgesehen, geändert worden sind. Ausgenommen ist Wohnraum, bei dem die Miethöhe durch Gesetz oder im Zusammenhang mit einer Förderzusage festgelegt worden ist.(3) Bei Erhöhungen nach Absatz 1 darf sich die Miete innerhalb von drei Jahren, von Erhöhungen nach den §§ 559 bis 560 abgesehen, nicht um mehr als 20 vom Hundert erhöhen (Kappungsgrenze). Der Prozentsatz nach Satz 1 beträgt 15 vom Hundert, wenn die ausreichende Versorgung der Bevölkerung mit Mietwohnungen zu angemessenen Bedingungen in einer Gemeinde oder einem Teil einer Gemeinde besonders gefährdet ist und diese Gebiete nach Satz 3 bestimmt sind. Die Landesregierungen werden ermächtigt, diese Gebiete durch Rechtsverordnung für die Dauer von jeweils höchstens fünf Jahren zu bestimmen.(4) Die Kappungsgrenze gilt nicht, 1.wenn eine Verpflichtung des Mieters zur Ausgleichszahlung nach den Vorschriften über den Abbau der Fehlsubventionierung im Wohnungswesen wegen des Wegfalls der öffentlichen Bindung erloschen ist und2.soweit die Erhöhung den Betrag der zuletzt zu entrichtenden Ausgleichszahlung nicht übersteigt.Der Vermieter kann vom Mieter frühestens vier Monate vor dem Wegfall der öffentlichen Bindung verlangen, ihm innerhalb eines Monats über die Verpflichtung zur Ausgleichszahlung und über deren Höhe Auskunft zu erteilen. Satz 1 gilt entsprechend, wenn die Verpflichtung des Mieters zur Leistung einer Ausgleichszahlung nach den §§ 34 bis 37 des Wohnraumförderungsgesetzes und den hierzu ergangenen landesrechtlichen Vorschriften wegen Wegfalls der Mietbindung erloschen ist.(5) Von dem Jahresbetrag, der sich bei einer Erhöhung auf die ortsübliche Vergleichsmiete ergäbe, sind Drittmittel im Sinne des § 559a abzuziehen, im Falle des § 559a Absatz 1 mit 8 Prozent des Zuschusses.(6) Eine zum Nachteil des Mieters abweichende Vereinbarung ist unwirksam. The downstream remedy is applied as if the three-month deadline had already expired on the same path. This record applies the opposite remedy class immediately on the same obligation path, creating a non-curable enforcement conflict if the upstream classification is still in force.", "text_zh": "重点判断：这段可能是矛盾的一端。它单独看未必错，但和远处另一段放在一起可能无法同时成立。", "reading_hint_zh": "重点判断：这段可能是矛盾的一端。它单独看未必错，但和远处另一段放在一起可能无法同时成立。", "expert_hint_title_zh": "高风险重点段落", "expert_hint_reason_zh": "这段是高风险重点段落。 它包含的要求可能和另一段文字不能同时成立，建议专家直接核对。 风险证据：The downstream remedy is applied as if the three-month deadline had already expired on the same path. This record applies the opposite remedy class immediately on the same obligation path, creating a non-curable enforcement conflict if the upstream classification is still in force.", "expert_hint_level": "risk", "kind": "risk", "is_risk_endpoint": true, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "The downstream remedy is applied as if the three-month deadline had already expired on the same path. This record applies the opposite remedy class immediately on the same obligation path, creating a non-curable enforcement conflict if the upstream classification is still in force.", "stats": "mean_score=0.38; visit_count=10; conflict_count=6; is_oc_detected=False", "display_id": "段落 03", "short_id": "bgb_558", "role_label_zh": "risk"}, {"index": 4, "node_id": "bgb_559", "title": "§559 Mieterhöhung nach Modernisierungsmaßnahmen", "text_en": "§559 Mieterhöhung nach Modernisierungsmaßnahmen\n\n(1) Hat der Vermieter Modernisierungsmaßnahmen im Sinne des § 555b Nummer 1, 3, 4, 5 oder 6 durchgeführt, so kann er die jährliche Miete um 8 Prozent der für die Wohnung aufgewendeten Kosten erhöhen. Im Fall des § 555b Nummer 4a ist die Erhöhung nur zulässig, wenn der Mieter seinen Anbieter von öffentlich zugänglichen Telekommunikationsdiensten über den errichteten Anschluss frei wählen kann und der Vermieter kein Bereitstellungsentgelt gemäß § 72 des Telekommunikationsgesetzes als Betriebskosten umlegt oder umgelegt hat.(2) Kosten, die für Erhaltungsmaßnahmen erforderlich gewesen wären, gehören nicht zu den aufgewendeten Kosten nach Absatz 1; sie sind, soweit erforderlich, durch Schätzung zu ermitteln. Dabei ist der Abnutzungsgrad der Bauteile und Einrichtungen, die von einer modernisierenden Erneuerung erfasst werden, angemessen zu berücksichtigen.(3) Werden Modernisierungsmaßnahmen für mehrere Wohnungen durchgeführt, so sind die Kosten angemessen auf die einzelnen Wohnungen aufzuteilen.(3a) Bei Erhöhungen der jährlichen Miete nach Absatz 1 darf sich die monatliche Miete innerhalb von sechs Jahren, von Erhöhungen nach § 558 oder § 560 abgesehen, nicht um mehr als 3 Euro je Quadratmeter Wohnfläche erhöhen. Beträgt die monatliche Miete vor der Mieterhöhung weniger als 7 Euro pro Quadratmeter Wohnfläche, so darf sie sich abweichend von Satz 1 nicht um mehr als 2 Euro je Quadratmeter Wohnfläche erhöhen. Sind bei einer Modernisierungsmaßnahme, die mittels Einbaus oder Aufstellung einer Heizungsanlage zum Zwecke der Inbetriebnahme in einem Gebäude durchgeführt wird und die zu einer Erhöhung der jährlichen Miete nach Absatz 1 berechtigt, zugleich die Voraussetzungen des § 555b Nummer 1 oder Nummer 1a erfüllt, so darf sich die monatliche Miete insoweit um nicht mehr als 0,50 Euro je Quadratmeter Wohnfläche innerhalb von sechs Jahren erhöhen; die Sätze 1 und 2 bleiben unberührt.(4) Die Mieterhöhung ist ausgeschlossen, soweit sie auch unter Berücksichtigung der voraussichtlichen künftigen Betriebskosten für den Mieter eine Härte bedeuten würde, die auch unter Würdigung der berechtigten Interessen des Vermieters nicht zu rechtfertigen ist. Eine Abwägung nach Satz 1 findet nicht statt, wenn 1.die Mietsache lediglich in einen Zustand versetzt wurde, der allgemein üblich ist, oder2.die Modernisierungsmaßnahme auf Grund von Umständen durchgeführt wurde, die der Vermieter nicht zu vertreten hatte, es sei denn, die Modernisierungsmaßnahme erfüllt auch die Voraussetzungen des § 555b Nummer 1 oder Nummer 1a und wurde mittels Einbaus oder Aufstellung einer Heizungsanlage zum Zwecke der Inbetriebnahme in einem Gebäude durchgeführt.(5) Umstände, die eine Härte nach Absatz 4 Satz 1 begründen, sind nur zu berücksichtigen, wenn sie nach § 555d Absatz 3 bis 5 rechtzeitig mitgeteilt worden sind. Die Bestimmungen über die Ausschlussfrist nach Satz 1 sind nicht anzuwenden, wenn die tatsächliche Mieterhöhung die angekündigte um mehr als 10 Prozent übersteigt.(6) Eine zum Nachteil des Mieters abweichende Vereinbarung ist unwirksam.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.4222222222222222; visit_count=45; conflict_count=49; is_oc_detected=False", "display_id": "段落 04", "short_id": "bgb_559", "role_label_zh": "suggested"}, {"index": 5, "node_id": "bgb_559a", "title": "§559a Anrechnung von Drittmitteln", "text_en": "§559a Anrechnung von Drittmitteln\n\n(1) Kosten, die vom Mieter oder für diesen von einem Dritten übernommen oder die mit Zuschüssen aus öffentlichen Haushalten gedeckt werden, gehören nicht zu den aufgewendeten Kosten im Sinne des § 559.(2) Werden die Kosten für die Modernisierungsmaßnahmen ganz oder teilweise durch zinsverbilligte oder zinslose Darlehen aus öffentlichen Haushalten gedeckt, so verringert sich der Erhöhungsbetrag nach § 559 um den Jahresbetrag der Zinsermäßigung. Dieser wird errechnet aus dem Unterschied zwischen dem ermäßigten Zinssatz und dem marktüblichen Zinssatz für den Ursprungsbetrag des Darlehens. Maßgebend ist der marktübliche Zinssatz für erstrangige Hypotheken zum Zeitpunkt der Beendigung der Modernisierungsmaßnahmen. Werden Zuschüsse oder Darlehen zur Deckung von laufenden Aufwendungen gewährt, so verringert sich der Erhöhungsbetrag um den Jahresbetrag des Zuschusses oder Darlehens.(3) Ein Mieterdarlehen, eine Mietvorauszahlung oder eine von einem Dritten für den Mieter erbrachte Leistung für die Modernisierungsmaßnahmen stehen einem Darlehen aus öffentlichen Haushalten gleich. Mittel der Finanzierungsinstitute des Bundes oder eines Landes gelten als Mittel aus öffentlichen Haushalten.(4) Kann nicht festgestellt werden, in welcher Höhe Zuschüsse oder Darlehen für die einzelnen Wohnungen gewährt worden sind, so sind sie nach dem Verhältnis der für die einzelnen Wohnungen aufgewendeten Kosten aufzuteilen.(5) Eine zum Nachteil des Mieters abweichende Vereinbarung ist unwirksam.", "text_zh": "重点判断：这段可能被前后的矛盾影响。它自己不一定错，但可能是修复时必须看的相关段落。", "reading_hint_zh": "重点判断：这段可能被前后的矛盾影响。它自己不一定错，但可能是修复时必须看的相关段落。", "expert_hint_title_zh": "可能受影响段落", "expert_hint_reason_zh": "这段可能是受影响段落。 它不一定自己有错，但如果前后段落存在冲突，修复时可能需要一起看。", "expert_hint_level": "affected", "kind": "affected", "is_risk_endpoint": false, "is_bridge": false, "is_affected": true, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.27058823529411763; visit_count=17; conflict_count=7; is_oc_detected=False", "display_id": "段落 05", "short_id": "bgb_559a", "role_label_zh": "可能受影响段落"}, {"index": 6, "node_id": "bgb_559b", "title": "§559b Geltendmachung der Erhöhung, Wirkung der Erhöhungserklärung", "text_en": "§559b Geltendmachung der Erhöhung, Wirkung der Erhöhungserklärung\n\n(1) Die Mieterhöhung nach § 559 ist dem Mieter in Textform zu erklären. Die Erklärung ist nur wirksam, wenn in ihr die Erhöhung auf Grund der entstandenen Kosten berechnet und entsprechend den Voraussetzungen der §§ 559 und 559a erläutert wird. § 555c Absatz 3 gilt entsprechend.(2) Der Mieter schuldet die erhöhte Miete mit Beginn des dritten Monats nach dem Zugang der Erklärung. Die Frist verlängert sich um sechs Monate, wenn 1.der Vermieter dem Mieter die Modernisierungsmaßnahme nicht nach den Vorschriften des § 555c Absatz 1 und 3 bis 5 angekündigt hat oder2.die tatsächliche Mieterhöhung die angekündigte um mehr als 10 Prozent übersteigt.(3) Eine zum Nachteil des Mieters abweichende Vereinbarung ist unwirksam.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 它曾和其他重点段落一起出现，可能有助于理解前后关系。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": true, "in_oc": false, "in_context": true, "injected_note": "", "stats": "mean_score=0.32941176470588235; visit_count=17; conflict_count=6; is_oc_detected=False", "display_id": "段落 06", "short_id": "bgb_559b", "role_label_zh": "suggested"}, {"index": 7, "node_id": "bgb_559e", "title": "§559e Mieterhöhung nach Einbau oder Aufstellung einer Heizungsanlage", "text_en": "§559e Mieterhöhung nach Einbau oder Aufstellung einer Heizungsanlage (1) Hat der Vermieter Modernisierungsmaßnahmen nach § 555b Nummer 1a durchgeführt, welche die Voraussetzungen für Zuschüsse aus öffentlichen Haushalten dem Grunde nach erfüllen, und dabei Drittmittel nach § 559a in Anspruch genommen, so kann er die jährliche Miete um 10 Prozent der für die Wohnung aufgewendeten Kosten abzüglich der in Anspruch genommenen Drittmittel erhöhen. Wenn eine Förderung nicht erfolgt, obwohl die Voraussetzungen für eine Förderung dem Grunde nach erfüllt sind, kann der Vermieter die jährliche Miete nach Maßgabe des § 559 erhöhen.(2) § 559 Absatz 2 Satz 1 ist mit der Maßgabe anwendbar, dass Kosten, die für Erhaltungsmaßnahmen erforderlich gewesen wären, pauschal in Höhe von 15 Prozent nicht zu den aufgewendeten Kosten gehören.(3) § 559 Absatz 3a Satz 1 ist mit der Maßgabe anwendbar, dass sich im Hinblick auf eine Modernisierungsmaßnahme nach § 555b Nummer 1a die monatliche Miete um nicht mehr als 0,50 Euro je Quadratmeter Wohnfläche innerhalb von sechs Jahren erhöhen darf. Ist der Vermieter daneben zu Mieterhöhungen nach § 559 Absatz 1 berechtigt, so dürfen die in § 559 Absatz 3a Satz 1 und 2 genannten Grenzen nicht überschritten werden.(4) § 559 Absatz 3, 4 und 5 sowie die §§ 559b bis 559d gelten entsprechend.(5) Eine zum Nachteil des Mieters abweichende Vereinbarung ist unwirksam. The grace period remains open until the three-month deadline expires. Before that date, the obligation is handled as timely cured. This classification is mandatory for the same obligation path. A contrary downstream treatment would make the same debtor both released from the burden and immediately in default, with no residual discretion to reconcile the two remedies.", "text_zh": "重点判断：这段可能是矛盾的一端。它单独看未必错，但和远处另一段放在一起可能无法同时成立。", "reading_hint_zh": "重点判断：这段可能是矛盾的一端。它单独看未必错，但和远处另一段放在一起可能无法同时成立。", "expert_hint_title_zh": "高风险重点段落", "expert_hint_reason_zh": "这段是高风险重点段落。 它包含的要求可能和另一段文字不能同时成立，建议专家直接核对。 风险证据：The grace period remains open until the three-month deadline expires. Before that date, the obligation is handled as timely cured. This classification is mandatory for the same obligation path. A contrary downstream treatment would make the same debtor both released from the burden and immediately in default, with no residual discretion to reconcile the two remedies.", "expert_hint_level": "risk", "kind": "risk", "is_risk_endpoint": true, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "The grace period remains open until the three-month deadline expires. Before that date, the obligation is handled as timely cured. This classification is mandatory for the same obligation path. A contrary downstream treatment would make the same debtor both released from the burden and immediately in default, with no residual discretion to reconcile the two remedies.", "stats": "mean_score=0.5083333333333333; visit_count=36; conflict_count=40; is_oc_detected=False", "display_id": "段落 07", "short_id": "bgb_559e", "role_label_zh": "risk"}, {"index": 8, "node_id": "bgb_559c", "title": "§559c Vereinfachtes Verfahren", "text_en": "§559c Vereinfachtes Verfahren\n\n(1) Übersteigen die für die Modernisierungsmaßnahme geltend gemachten Kosten für die Wohnung vor Abzug der Pauschale nach Satz 2 10 000 Euro nicht, so kann der Vermieter die Mieterhöhung nach einem vereinfachten Verfahren berechnen. Als Kosten, die für Erhaltungsmaßnahmen erforderlich gewesen wären (§ 559 Absatz 2), werden pauschal 30 Prozent der nach Satz 1 geltend gemachten Kosten abgezogen. § 559 Absatz 4 und § 559a Absatz 2 Satz 1 bis 3 finden keine Anwendung; dies gilt im Hinblick auf § 559 Absatz 4 nicht, wenn die Modernisierungsmaßnahme auch die Voraussetzungen des § 555b Nummer 1 oder Nummer 1a erfüllt und mittels Einbaus oder Aufstellung einer Heizungsanlage zum Zwecke der Inbetriebnahme in einem Gebäude durchgeführt wurde.(2) Hat der Vermieter die Miete in den letzten fünf Jahren bereits nach Absatz 1 oder nach § 559 oder § 559e erhöht, so mindern sich die Kosten, die nach Absatz 1 Satz 1 für die weitere Modernisierungsmaßnahme geltend gemacht werden können, um die Kosten, die in diesen früheren Verfahren für Modernisierungsmaßnahmen geltend gemacht wurden.(3) § 559b gilt für das vereinfachte Verfahren entsprechend. Der Vermieter muss in der Mieterhöhungserklärung angeben, dass er die Mieterhöhung nach dem vereinfachten Verfahren berechnet hat.(4) Hat der Vermieter eine Mieterhöhung im vereinfachten Verfahren geltend gemacht, so kann er innerhalb von fünf Jahren nach Zugang der Mieterhöhungserklärung beim Mieter keine Mieterhöhungen nach § 559 oder § 559e geltend machen. Dies gilt nicht, 1.soweit der Vermieter in diesem Zeitraum Modernisierungsmaßnahmen auf Grund einer gesetzlichen Verpflichtung durchzuführen hat und er diese Verpflichtung bei Geltendmachung der Mieterhöhung im vereinfachten Verfahren nicht kannte oder kennen musste,2.sofern eine Modernisierungsmaßnahme auf Grund eines Beschlusses von Wohnungseigentümern durchgeführt wird, der frühestens zwei Jahre nach Zugang der Mieterhöhungserklärung beim Mieter gefasst wurde.(5) Für die Modernisierungsankündigung, die zu einer Mieterhöhung nach dem vereinfachten Verfahren führen soll, gilt § 555c mit den Maßgaben, dass 1.der Vermieter in der Modernisierungsankündigung angeben muss, dass er von dem vereinfachten Verfahren Gebrauch macht,2.es der Angabe der voraussichtlichen künftigen Betriebskosten nach § 555c Absatz 1 Satz 2 Nummer 3 nicht bedarf.", "text_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "reading_hint_zh": "阅读提示：这段被系统认为有助于理解问题，但专家可以不同意。请按正文内容独立判断。", "expert_hint_title_zh": "建议优先看", "expert_hint_reason_zh": "系统建议优先看这段。 请重点核对：它是否和其他段落放在一起会冲突，或者是否是修复问题时必须保留的材料。 这段在多次小范围检查中被反复注意到，所以建议先看；最终判断仍以你的标注为准。", "expert_hint_level": "focus", "kind": "suggested", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": true, "in_naive_subgraph": false, "in_oc": true, "in_context": true, "injected_note": "", "stats": "mean_score=0.6133333333333334; visit_count=45; conflict_count=73; is_oc_detected=True", "display_id": "段落 08", "short_id": "bgb_559c", "role_label_zh": "suggested"}, {"index": 9, "node_id": "bgb_559d", "title": "§559d Pflichtverletzungen bei Ankündigung oder Durchführung einer baulichen Veränderung", "text_en": "§559d Pflichtverletzungen bei Ankündigung oder Durchführung einer baulichen Veränderung\n\nEs wird vermutet, dass der Vermieter seine Pflichten aus dem Schuldverhältnis verletzt hat, wenn 1.mit der baulichen Veränderung nicht innerhalb von zwölf Monaten nach deren angekündigtem Beginn oder, wenn Angaben hierzu nicht erfolgt sind, nach Zugang der Ankündigung der baulichen Veränderung begonnen wird,2.in der Ankündigung nach § 555c Absatz 1 ein Betrag für die zu erwartende Mieterhöhung angegeben wird, durch den die monatliche Miete mindestens verdoppelt würde,3.die bauliche Veränderung in einer Weise durchgeführt wird, die geeignet ist, zu erheblichen, objektiv nicht notwendigen Belastungen des Mieters zu führen, oder4.die Arbeiten nach Beginn der baulichen Veränderung mehr als zwölf Monate ruhen.Diese Vermutung gilt nicht, wenn der Vermieter darlegt, dass für das Verhalten im Einzelfall ein nachvollziehbarer objektiver Grund vorliegt.", "text_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "reading_hint_zh": "上下文段落：主要用于理解前后关系。如果你认为它也有风险，可以直接标出来。", "expert_hint_title_zh": "普通展示段落", "expert_hint_reason_zh": "系统没有把这段列为优先审阅段落，但它仍然完整展示。若你认为它有问题，或修复时必须一起看，可以直接标出来。", "expert_hint_level": "context", "kind": "context", "is_risk_endpoint": false, "is_bridge": false, "is_affected": false, "in_sa_core": false, "in_naive_subgraph": false, "in_oc": false, "in_context": false, "injected_note": "", "stats": "mean_score=0.3076923076923076; visit_count=13; conflict_count=3; is_oc_detected=False", "display_id": "段落 09", "short_id": "bgb_559d", "role_label_zh": "context"}], "risk_nodes": ["bgb_559e", "bgb_558"], "bridge_nodes": ["bgb_555d"], "affected_nodes": ["bgb_555c", "bgb_559a"], " <script>
const CASES = JSON.parse(document.getElementById('case-data').textContent);
const STORE_KEY = 'plain_structural_conflict_annotations_v2';
const EXPERTS = [
  { id: 'expert_1', label: '专家 1' },
  { id: 'expert_2', label: '专家 2' },
  { id: 'expert_3', label: '专家 3' },
];
let activeIndex = 0;
let activeExpert = localStorage.getItem(STORE_KEY + '_active_expert') || 'expert_1';
if (!EXPERTS.some(expert => expert.id === activeExpert)) activeExpert = 'expert_1';
let annotations = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'}[c]));
function expertBucket(expertId = activeExpert) {
  if (!annotations[expertId]) annotations[expertId] = {};
  return annotations[expertId];
}
const annFor = (caseId, expertId = activeExpert) => (annotations[expertId] || {})[caseId] || {};
const pct = (v) => (v === null || v === undefined || v === '' || Number.isNaN(Number(v))) ? '-' : Math.round(Number(v) * 100) + '%';

function saveStore() {
  localStorage.setItem(STORE_KEY, JSON.stringify(annotations));
  localStorage.setItem(STORE_KEY + '_active_expert', activeExpert);
  renderCaseList();
}

function isDone(caseId, expertId = activeExpert) {
  const a = annFor(caseId, expertId);
  return Boolean(a.overall_conflict && a.material_sufficient && a.confidence);
}

function caseTitle(c) {
  const m = c.metadata;
  return `${m.domain_label} · ${m.scc_size} 段`;
}

function renderCaseList() {
  $('totalCount').textContent = CASES.length;
  $('doneCount').textContent = CASES.filter(c => isDone(c.metadata.case_id)).length;
  const totalDone = EXPERTS.reduce((sum, expert) => sum + CASES.filter(c => isDone(c.metadata.case_id, expert.id)).length, 0);
  $('domainCount').textContent = `${totalDone}/${CASES.length * EXPERTS.length}`;
  $('caseList').innerHTML = CASES.map((c, i) => {
    const m = c.metadata;
    const doneSlots = EXPERTS.filter(expert => isDone(m.case_id, expert.id)).length;
    return `<button class="case-btn ${i === activeIndex ? 'active' : ''}" data-case-index="${i}">
      <span class="done">${doneSlots}/3</span>
      <strong>${esc(caseTitle(c))}</strong>
      <small>${esc(m.template_label)} · ${esc(m.model)} · ${esc(m.case_id)}</small>
    </button>`;
  }).join('');
  document.querySelectorAll('[data-case-index]').forEach(btn => {
    btn.addEventListener('click', () => {
      saveCurrentAnnotation(false);
      activeIndex = Number(btn.dataset.caseIndex);
      renderAll();
    });
  });
}

function nodeJudgementLabel(value) {
  return {
    clear_risk: '有明显问题',
    related: '可能有关',
    no_risk: '没看出问题',
    unsure: '不确定',
  }[value] || '';
}

function renderNodeCard(c, node) {
  const a = annFor(c.metadata.case_id);
  const nodeAnn = (a.nodes || {})[node.node_id] || {};
  const checked = (value) => nodeAnn.judgement === value ? 'checked' : '';
  const keepChecked = nodeAnn.keep_for_repair ? 'checked' : '';
  const hintLevel = node.expert_hint_level || 'context';
  const cardClass = hintLevel === 'risk' ? 'risk-focus' : (hintLevel === 'affected' ? 'affected-focus' : (hintLevel === 'focus' ? 'system-focus' : ''));
  return `<article class="node-card ${cardClass}" data-node-id="${esc(node.node_id)}">
    <div class="node-main">
      <h3>${esc(node.display_id || ('段落 ' + node.index))}</h3>
      <div class="node-title">${esc(node.title || '')}</div>
      <div class="node-id">原始编号：${esc(node.node_id)}</div>
      <div class="node-text">${esc(node.text_en || '')}</div>
    </div>
    <div class="node-form">
      <div class="attention-box ${hintLevel}">
        <div class="attention-title"><span class="attention-dot"></span>${esc(node.expert_hint_title_zh || '阅读提示')}</div>
        <div class="attention-reason">${esc(node.expert_hint_reason_zh || '')}</div>
      </div>
      <h4>请标注这段</h4>
      <p class="desc">只根据这段和整组文字来判断：它是否明显有问题，或是否需要放进最终修复材料。</p>
      <div class="radio-stack">
        <label><input type="radio" data-node-risk value="clear_risk" ${checked('clear_risk')}> <span><b>有明显问题</b><br>这段自己有问题，或和别的段落放在一起明显冲突。</span></label>
        <label><input type="radio" data-node-risk value="related" ${checked('related')}> <span><b>可能有关</b><br>这段本身未必错，但修复冲突时可能需要一起看。</span></label>
        <label><input type="radio" data-node-risk value="no_risk" ${checked('no_risk')}> <span><b>没看出问题</b><br>看起来只是普通上下文。</span></label>
        <label><input type="radio" data-node-risk value="unsure" ${checked('unsure')}> <span><b>不确定</b><br>需要更多上下文或专业判断。</span></label>
      </div>
      <label class="checkline"><input type="checkbox" data-node-keep ${keepChecked}> <span><b>应放入最终修复材料</b><br>如果只给别人看少量段落来修复问题，我会保留这一段。</span></label>
      <textarea data-node-note placeholder="可选：说明为什么这样判断">${esc(nodeAnn.note || '')}</textarea>
    </div>
  </article>`;
}

function renderCaseForm(c) {
  const a = annFor(c.metadata.case_id);
  const radio = (name, value) => a[name] === value ? 'checked' : '';
  return `<section>
    <h2 class="section-title">整组文字判断</h2>
    <div class="case-form">
      <div class="question">
        <h3>这组文字整体是否有真实冲突？</h3>
        <div class="options">
          <label><input type="radio" name="overall_conflict" value="yes" ${radio('overall_conflict','yes')}>有真实冲突</label>
          <label><input type="radio" name="overall_conflict" value="maybe" ${radio('overall_conflict','maybe')}>有可疑冲突</label>
          <label><input type="radio" name="overall_conflict" value="no" ${radio('overall_conflict','no')}>没有明显冲突</label>
          <label><input type="radio" name="overall_conflict" value="unsure" ${radio('overall_conflict','unsure')}>不确定</label>
        </div>
      </div>
      <div class="question">
        <h3>你勾选的段落是否足够定位和修复问题？</h3>
        <div class="options">
          <label><input type="radio" name="material_sufficient" value="yes" ${radio('material_sufficient','yes')}>足够</label>
          <label><input type="radio" name="material_sufficient" value="partial" ${radio('material_sufficient','partial')}>部分足够</label>
          <label><input type="radio" name="material_sufficient" value="no" ${radio('material_sufficient','no')}>不够</label>
          <label><input type="radio" name="material_sufficient" value="unsure" ${radio('material_sufficient','unsure')}>不确定</label>
        </div>
      </div>
      <div class="question">
        <h3>是否还需要更多上下文？</h3>
        <div class="options">
          <label><input type="radio" name="need_more_context" value="yes" ${radio('need_more_context','yes')}>需要</label>
          <label><input type="radio" name="need_more_context" value="no" ${radio('need_more_context','no')}>不需要</label>
          <label><input type="radio" name="need_more_context" value="unsure" ${radio('need_more_context','unsure')}>不确定</label>
        </div>
      </div>
      <div class="question">
        <h3>标注信心</h3>
        <select name="confidence">
          <option value="">请选择</option>
          ${[1,2,3,4,5].map(v => `<option value="${v}" ${String(a.confidence || '') === String(v) ? 'selected' : ''}>${v} / 5</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="question" style="margin-top:14px;">
      <h3>备注</h3>
      <textarea name="comments" rows="5" placeholder="可选：写下你认为真正冲突的段落、缺失材料、或判断理由">${esc(a.comments || '')}</textarea>
    </div>
  </section>`;
}

function renderWorkspace() {
  const c = CASES[activeIndex];
  const m = c.metadata;
  const expert = EXPERTS.find(e => e.id === activeExpert) || EXPERTS[0];
  $('workspace').innerHTML = `
    <div class="case-head">
      <h2>${esc(caseTitle(c))}</h2>
      <div class="hint">${esc(m.template_label)}。${esc(c.case_plain_zh || c.case_summary?.zh || '')}</div>
      <div class="case-meta">
        <span class="pill blue">样本 ${esc(m.case_id)}</span>
        <span class="pill green">${esc(expert.label)}</span>
        <span class="pill">模型 ${esc(m.model)}</span>
        <span class="pill amber">请独立判断，不需要理解算法</span>
      </div>
    </div>
    <div class="guide">
      <b>怎么标：</b>从上到下读完整组文字。每段右侧选择“有明显问题 / 可能有关 / 没看出问题 / 不确定”。
      如果你认为某段应该留给后续修复人员，请勾选“应放入最终修复材料”。页面会自动保存在本浏览器，最后点击“生成 Excel”。
    </div>
    <h2 class="section-title">完整文本与逐段标注</h2>
    ${c.full_nodes.map(node => renderNodeCard(c, node)).join('')}
    ${renderCaseForm(c)}
    <div class="savebar">
      <button class="primary" id="saveBtn">保存当前样本</button>
      <button class="green" id="exportBtnBottom">生成 Excel</button>
      <span class="hint">切换样本或专家前会自动保存；生成的 Excel 包含三位专家的“样本整体标注”和“逐段标注”。</span>
    </div>
  `;
  $('saveBtn').addEventListener('click', () => saveCurrentAnnotation(true));
  $('exportBtnBottom').addEventListener('click', exportExcel);
}

function saveCurrentAnnotation(showMessage = false) {
  const c = CASES[activeIndex];
  const root = $('workspace');
  if (!root || !c) return;
  const getRadio = (name) => root.querySelector(`input[name="${name}"]:checked`)?.value || '';
  const nodeData = {};
  root.querySelectorAll('.node-card').forEach(card => {
    const nodeId = card.dataset.nodeId;
    nodeData[nodeId] = {
      judgement: card.querySelector('input[data-node-risk]:checked')?.value || '',
      judgement_label: nodeJudgementLabel(card.querySelector('input[data-node-risk]:checked')?.value || ''),
      keep_for_repair: Boolean(card.querySelector('input[data-node-keep]')?.checked),
      note: card.querySelector('textarea[data-node-note]')?.value || '',
    };
  });
  expertBucket()[c.metadata.case_id] = {
    reviewer: $('reviewer').value || '',
    expert_slot: activeExpert,
    expert_label: (EXPERTS.find(e => e.id === activeExpert) || {}).label || activeExpert,
    overall_conflict: getRadio('overall_conflict'),
    material_sufficient: getRadio('material_sufficient'),
    need_more_context: getRadio('need_more_context'),
    confidence: root.querySelector('select[name="confidence"]')?.value || '',
    comments: root.querySelector('textarea[name="comments"]')?.value || '',
    nodes: nodeData,
    saved_at: new Date().toISOString(),
  };
  saveStore();
  if (showMessage) alert('已保存当前样本。');
}

function exportExcel() {
  saveCurrentAnnotation(false);
  const caseRows = [];
  const nodeRows = [];
  EXPERTS.forEach(expert => {
    CASES.forEach(c => {
      const m = c.metadata;
      const a = annFor(m.case_id, expert.id);
      const selected = Object.entries(a.nodes || {}).filter(([, v]) => v.keep_for_repair).map(([id]) => id);
      caseRows.push({
        专家编号: expert.label,
        标注者: a.reviewer || '',
        样本编号: m.case_id,
        文本类型: m.domain_label,
        段落数: m.scc_size,
        冲突类型: m.template_label,
        整体是否冲突: a.overall_conflict || '',
        勾选材料是否足够修复: a.material_sufficient || '',
        是否需要更多上下文: a.need_more_context || '',
        标注信心_1到5: a.confidence || '',
        专家勾选段落: selected.join(';'),
        备注: a.comments || '',
        保存时间: a.saved_at || '',
        隐藏对照_root: m.root_node,
        隐藏对照_witness: m.witness_node,
        隐藏对照_affected: m.affected_nodes,
        隐藏对照_系统建议: m.sa_core_nodes,
        隐藏对照_对照方法建议: m.naive_subgraph_nodes,
        隐藏指标_系统risk_any: m.sa_risk_any,
        隐藏指标_系统risk_all: m.sa_risk_all,
        隐藏指标_系统compression: m.sa_compression,
      });
      c.full_nodes.forEach(node => {
        const na = (a.nodes || {})[node.node_id] || {};
        nodeRows.push({
          专家编号: expert.label,
          标注者: a.reviewer || '',
          样本编号: m.case_id,
          文本类型: m.domain_label,
          段落序号: node.display_id || node.index,
          原始编号: node.node_id,
          标题: node.title || '',
          原文: node.text_en || '',
          页面提示: node.expert_hint_title_zh || '',
          页面提示说明: node.expert_hint_reason_zh || '',
          专家判断: na.judgement_label || '',
          专家判断代码: na.judgement || '',
          是否放入最终修复材料: na.keep_for_repair ? '是' : '否',
          段落备注: na.note || '',
          隐藏对照_是否真实冲突端点: node.is_risk_endpoint ? '是' : '否',
          隐藏对照_是否中间传递段落: node.is_bridge ? '是' : '否',
          隐藏对照_是否受影响段落: node.is_affected ? '是' : '否',
          隐藏对照_系统是否保留: node.in_sa_core ? '是' : '否',
          隐藏对照_对照方法是否保留: node.in_naive_subgraph ? '是' : '否',
          隐藏对照_是否反复可疑: node.in_oc ? '是' : '否',
        });
      });
    });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(caseRows), '样本整体标注');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(nodeRows), '逐段标注');
  XLSX.writeFile(wb, `structural_conflict_annotations_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function renderAll() {
  renderCaseList();
  renderWorkspace();
}

$('exportBtn').addEventListener('click', exportExcel);
$('reviewer').addEventListener('input', () => {
  if (!annotations._reviewers) annotations._reviewers = {};
  annotations._reviewers[activeExpert] = $('reviewer').value || '';
  localStorage.setItem(STORE_KEY, JSON.stringify(annotations));
});
$('expertSlot').addEventListener('change', () => {
  saveCurrentAnnotation(false);
  activeExpert = $('expertSlot').value;
  $('reviewer').value = annotations._reviewers?.[activeExpert] || '';
  saveStore();
  renderAll();
});
$('expertSlot').value = activeExpert;
$('reviewer').value = annotations._reviewers?.[activeExpert] || '';
renderAll();
</script>
</body>
</html>
